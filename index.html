<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCPC 부서별 보고서 관리 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; }
        
        .animate-dropdown { 
            animation: dropdownSlide 0.2s ease-out; 
            transform-origin: top;
        }
        @keyframes dropdownSlide {
            from { opacity: 0; transform: translateY(-10px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        /* ── 공통 번호 리스트 */
        .auto-list { counter-reset: item; list-style-type: none; padding-left: 0; margin: 0; }
        .auto-list li { display: flex; margin-bottom: 3px; line-height: 1.55; font-size: 0.82rem; }
        .auto-list li::before {
            content: counter(item) ". ";
            counter-increment: item;
            font-weight: 700;
            margin-right: 5px;
            color: #334155;
            flex-shrink: 0;
        }

        /* ── 통합 보고서 테이블 (docx 양식과 동일) */
        .report-table {
            width: 100%; border-collapse: collapse; table-layout: fixed;
            border: 2px solid #000; background: #fff; font-size: 0.82rem;
        }
        .report-table th, .report-table td {
            border: 1px solid #000; padding: 8px 7px;
            vertical-align: top; word-break: break-word;
        }
        .report-table thead tr th {
            background: #000; color: #fff; font-size: 0.8rem;
            font-weight: 800; text-align: center; padding: 7px 5px;
        }
        .dept-col { width: 13%; vertical-align: middle !important; text-align: center; }
        .content-col { width: 29%; }

        /* ── 개별 보고서 단일 테이블 (화면 상세) */
        .detail-table {
            width: 100%; border-collapse: collapse; table-layout: fixed;
            border: 2px solid #000; background: #fff; font-size: 0.82rem;
        }
        .detail-table th, .detail-table td {
            border: 1px solid #000; padding: 8px 7px;
            vertical-align: top; word-break: break-word;
        }
        .detail-table thead tr th {
            background: #000; color: #fff; font-size: 0.8rem;
            font-weight: 800; text-align: center; padding: 7px 5px;
        }
        .detail-dept-col { width: 14%; vertical-align: middle !important; text-align: center; }

        @media print {
            .no-print { display: none !important; }
            .print-area { display: block !important; width: 100% !important; margin: 0 !important; padding: 0 !important; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            @page { size: A4 portrait; margin: 1cm; }
        }

        .loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9); z-index: 9999;
            display: none; justify-content: center; align-items: center;
        }

        .form-overlay { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auto-resize-textarea {
            overflow: hidden;
            min-height: 100px; 
            transition: height 0.1s ease, border-color 0.2s;
            line-height: 1.6;
        }

        .dept-btn-active {
            background-color: #4f46e5 !important;
            color: white !important;
            border-color: #4338ca !important;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.4);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <div id="loading" class="loading-overlay">
        <div class="flex flex-col items-center">
            <i class="fas fa-circle-notch fa-spin text-4xl text-indigo-600 mb-4"></i>
            <p class="font-bold text-slate-600">데이터 처리 중...</p>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="sticky top-0 z-[1100] no-print bg-white/80 backdrop-blur-md border-b border-slate-200 px-4 py-3 md:px-6">
        <div class="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <h1 onclick="resetAll()" class="text-xl font-black flex items-center gap-2 cursor-pointer text-slate-900 shrink-0">
                <i class="fas fa-church text-indigo-600"></i> CCPC <span class="text-indigo-600">부서별 보고서</span>
            </h1>
            
            <div class="flex items-center gap-2 bg-slate-100 p-1.5 rounded-2xl border border-slate-200 shadow-sm">
                <button onclick="resetAll()" class="px-4 py-2.5 bg-white text-slate-600 rounded-xl hover:bg-slate-50 transition border border-slate-200 group flex items-center gap-2 shadow-sm">
                    <i class="fas fa-circle-notch text-sm group-hover:rotate-180 transition-transform duration-500"></i>
                    <span class="text-xs font-bold">초기화</span>
                </button>

                <div class="relative">
                    <button onclick="toggleMonthlyModal()" class="bg-indigo-600 text-white px-5 py-2.5 rounded-xl text-xs font-black hover:bg-indigo-700 transition flex items-center gap-2 shadow-sm">
                        월별 통합 보고서 <i class="fas fa-chevron-down opacity-50 text-[10px]"></i>
                    </button>
                    <div id="monthly-modal" class="hidden absolute top-full left-1/2 -translate-x-1/2 mt-3 w-64 bg-white rounded-2xl shadow-2xl border border-slate-200 p-4 animate-dropdown z-[1200]">
                        <h2 class="text-slate-900 font-black text-sm mb-3 text-center">통합 조회 기간 선택</h2>
                        <div class="grid grid-cols-2 gap-2 mb-4">
                            <select id="filter-year" class="bg-slate-50 border-slate-200 rounded-lg p-2 border text-xs outline-none focus:border-indigo-500"></select>
                            <select id="filter-month" class="bg-slate-50 border-slate-200 rounded-lg p-2 border text-xs outline-none focus:border-indigo-500">
                                <option value="01">1월</option><option value="02">2월</option><option value="03">3월</option><option value="04">4월</option>
                                <option value="05">5월</option><option value="06">6월</option><option value="07">7월</option><option value="08">8월</option>
                                <option value="09">9월</option><option value="10">10월</option><option value="11">11월</option><option value="12">12월</option>
                            </select>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="toggleMonthlyModal(false)" class="flex-1 bg-slate-100 text-slate-600 py-2.5 rounded-lg font-bold hover:bg-slate-200 transition text-xs">취소</button>
                            <button onclick="generateMonthlyReport()" class="flex-[2] bg-slate-900 text-white py-2.5 rounded-lg font-bold hover:bg-black transition text-xs">보고서 생성</button>
                        </div>
                    </div>
                </div>

                <button id="btn-open-form" onclick="toggleWriteForm(true)" class="px-4 py-2.5 bg-white text-emerald-600 rounded-xl hover:bg-emerald-50 transition border border-slate-200 flex items-center gap-2 shadow-sm">
                    <i class="fas fa-plus text-sm"></i>
                    <span class="text-xs font-black">새 보고서 작성</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-4 md:p-6 mb-20">
        <!-- 대시보드 -->
        <div id="dashboard" class="grid grid-cols-4 gap-4 mb-8 no-print">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                <p class="text-[10px] text-slate-400 font-bold uppercase mb-1">총 누적 보고서</p>
                <h2 id="total-count" class="text-3xl font-black">0</h2>
            </div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                <p class="text-[10px] text-slate-400 font-bold uppercase mb-1">이번 달 제출 건수</p>
                <h2 id="month-count" class="text-3xl font-black">0</h2>
            </div>
            <div class="col-span-2 bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                <p class="text-[10px] text-slate-400 font-bold uppercase mb-2">이번 달 제출 부서 (클릭 시 조회)</p>
                <div id="active-depts" class="flex flex-wrap gap-1.5"></div>
            </div>
        </div>

        <section id="section-search" class="no-print">
            <div id="search-bar-container" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row gap-3 items-center mb-6">
                <div class="relative flex-1 w-full">
                    <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-300 text-sm"></i>
                    <input type="text" id="search" placeholder="부서명이나 작성자를 입력하여 검색..." class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-100 rounded-xl outline-none text-sm focus:ring-2 focus:ring-indigo-500 transition" onkeyup="handleSearch(this.value)">
                </div>
            </div>

            <div id="date-selection-area" class="hidden flex flex-wrap gap-2 p-4 bg-indigo-50/50 rounded-2xl border border-indigo-100 mb-6"></div>

            <div id="main-content-area">
                <!-- 작성 폼 -->
                <div id="write-form-area" class="hidden form-overlay">
                    <div class="bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden">
                        <form id="report-form" class="p-6 md:p-8 space-y-8" onsubmit="submitForm(event)">
                            <input type="hidden" id="form-id" value="">
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                                <div class="space-y-2">
                                    <label class="text-[11px] font-black text-slate-500 uppercase ml-1">부서 선택</label>
                                    <select id="form-dept" required class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-bold focus:ring-2 focus:ring-indigo-500 outline-none"></select>
                                </div>
                                <div class="space-y-2">
                                    <label class="text-[11px] font-black text-slate-500 uppercase ml-1">작성자</label>
                                    <input type="text" id="form-writer" required placeholder="이름 입력" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-bold focus:ring-2 focus:ring-indigo-500 outline-none">
                                </div>
                                <div class="space-y-2">
                                    <label class="text-[11px] font-black text-slate-500 uppercase ml-1">작성일</label>
                                    <input type="date" id="form-date" required class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-bold focus:ring-2 focus:ring-indigo-500 outline-none">
                                </div>
                            </div>

                            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                <div class="space-y-2">
                                    <label class="text-[11px] font-black text-indigo-600 uppercase ml-1 flex items-center gap-2"><i class="fas fa-tasks"></i> 활동 내역</label>
                                    <textarea id="form-activity" required placeholder="내용이 없으면 자동으로 건너뜁니다." class="auto-resize-textarea w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition resize-none" onfocus="handleTextareaFocus(this)" oninput="handleTextareaInput(this)" onkeydown="handleTextareaKeydown(event, this)"></textarea>
                                </div>
                                <div class="space-y-2">
                                    <label class="text-[11px] font-black text-emerald-600 uppercase ml-1 flex items-center gap-2"><i class="fas fa-calendar-alt"></i> 사역 계획</label>
                                    <textarea id="form-plans" placeholder="내용이 없으면 자동으로 건너뜁니다." class="auto-resize-textarea w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl text-sm focus:ring-2 focus:ring-emerald-500 outline-none transition resize-none" onfocus="handleTextareaFocus(this)" oninput="handleTextareaInput(this)" onkeydown="handleTextareaKeydown(event, this)"></textarea>
                                </div>
                                <div class="space-y-2">
                                    <label class="text-[11px] font-black text-amber-600 uppercase ml-1 flex items-center gap-2"><i class="fas fa-comment-dots"></i> 건의사항 및 기타</label>
                                    <textarea id="form-prayer" placeholder="내용이 없으면 자동으로 건너뜁니다." class="auto-resize-textarea w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl text-sm focus:ring-2 focus:ring-amber-500 outline-none transition resize-none" onfocus="handleTextareaFocus(this)" oninput="handleTextareaInput(this)" onkeydown="handleTextareaKeydown(event, this)"></textarea>
                                </div>
                            </div>
                            
                            <div class="flex justify-center gap-3 pt-4">
                                <button type="button" onclick="toggleWriteForm(false)" class="w-32 bg-slate-200 text-slate-600 py-3 rounded-xl font-bold text-sm hover:bg-slate-300 transition">취소</button>
                                <button type="submit" id="submit-btn" class="w-48 bg-indigo-600 text-white py-3 rounded-xl font-black text-sm hover:bg-indigo-700 transition shadow-lg shadow-indigo-600/20">보고서 제출하기</button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- 결과 조회 영역 -->
                <div id="search-result-area">
                    <div class="text-center py-24 bg-white/50 rounded-3xl border border-dashed border-slate-300">
                        <i class="fas fa-search text-slate-300 text-5xl mb-6"></i>
                        <p class="text-slate-500 font-bold text-lg">검색어를 입력하거나 상단 부서 버튼을 클릭해 보고서를 조회하세요.</p>

        <!-- 월별 통합 보고서 (인쇄용) -->
        <section id="section-monthly" class="hidden">

                 <button onclick="exportToGoogleDocs()" id="btn-export" class="bg-indigo-600 text-white px-6 py-2.5 rounded-xl font-bold text-sm shadow-xl flex items-center gap-2 hover:bg-indigo-700 transition"><i class="fab fa-google-drive"></i> 구글 독스/프린트 출력</button>
                 <button onclick="cancelMonthlyReport()" class="text-slate-600 px-5 py-2.5 rounded-xl font-bold text-sm border border-slate-200 hover:bg-slate-50 transition">취소</button>

    <!-- 암호 확인 모달 -->
    <div id="pw-modal" class="hidden fixed inset-0 z-[9998] flex items-center justify-center p-4" style="background:rgba(15,23,42,0.5);backdrop-filter:blur(4px);">
        <div class="bg-white rounded-3xl shadow-2xl border border-slate-200 w-full max-w-sm p-8 animate-dropdown">
            <div class="flex items-center gap-3 mb-6">
                <div class="w-10 h-10 rounded-2xl bg-indigo-100 flex items-center justify-center shrink-0">
                    <i class="fas fa-lock text-indigo-600"></i>
                </div>
                <div>
                    <h3 id="pw-modal-title" class="font-black text-slate-900 text-base">암호 확인</h3>
                    <p id="pw-modal-subtitle" class="text-[11px] text-slate-400 mt-0.5">이 보고서는 암호가 설정되어 있습니다.</p>
                </div>
            </div>
            <input type="password" id="pw-modal-input" placeholder="암호를 입력하세요"
                class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-bold focus:ring-2 focus:ring-indigo-500 outline-none"
                onkeydown="if(event.key==='Enter')pwModalConfirm();if(event.key==='Escape')pwModalCancel();">
            <p id="pw-modal-error" class="hidden text-xs text-red-500 font-bold mt-2 mb-3 flex items-center gap-1"><i class="fas fa-exclamation-circle"></i> 암호가 일치하지 않습니다. 다시 입력해 주세요.</p>
            <div class="mb-5"></div>
            <div class="flex gap-3">
                <button id="pw-modal-cancel-btn" onclick="pwModalCancel()" class="flex-1 bg-slate-100 text-slate-600 py-3 rounded-xl font-bold text-sm hover:bg-slate-200 transition">취소</button>
                <button onclick="pwModalConfirm()" class="flex-[2] bg-indigo-600 text-white py-3 rounded-xl font-black text-sm hover:bg-indigo-700 transition shadow-lg shadow-indigo-600/20">확인</button>
            </div>
        </div>
    </div>

    
    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-8 py-4 rounded-2xl opacity-0 translate-y-4 transition-all z-[9999] text-sm font-bold shadow-2xl pointer-events-none"></div>

    <script>
        // ─────────────────────────────────────────────
        // ★ Google Apps Script 배포 URL
        // ─────────────────────────────────────────────
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbxwmaTmW0Sfsr72byeZn1yZWcgaIW102JMR5qSkuM-CJo9KS9D8X5fca9xOEBg0FZqFlA/exec';

        // GAS 호출 헬퍼 — JSONP (Apps Script CORS 우회 유일 방법)
        function gasCall(action, params, successHandler, failureHandler) {
            const cbName = '__gascb_' + action.replace(/[^a-z]/gi,'') + '_' + Date.now();
            const script = document.createElement('script');
            let done = false;

            const timer = setTimeout(function() {
                if (done) return;
                done = true;
                cleanup();
                if (typeof failureHandler === 'function')
                    failureHandler({ message: '요청 시간 초과 (15초). Apps Script 배포 URL과 액세스 권한을 확인하세요.' });
            }, 15000);

            function cleanup() {
                clearTimeout(timer);
                try { delete window[cbName]; } catch(e) {}
                if (script.parentNode) script.parentNode.removeChild(script);
            }

            window[cbName] = function(data) {
                if (done) return;
                done = true;
                cleanup();
                if (typeof successHandler === 'function') successHandler(data);
            };

            // Apps Script는 302 리다이렉트를 하는데,
            // <script> 태그는 리다이렉트를 자동으로 따라가므로 JSONP가 작동함
            const url = GAS_URL
                + '?action=' + encodeURIComponent(action)
                + '&callback=' + cbName
                + (params ? '&params=' + encodeURIComponent(JSON.stringify(params)) : '');

            script.onerror = function() {
                if (done) return;
                done = true;
                cleanup();
                if (typeof failureHandler === 'function')
                    failureHandler({ message: 'Script 로드 실패. Apps Script URL을 브라우저에서 직접 열어 확인하세요.' });
            };
            script.src = url;
            document.head.appendChild(script);
        }

        const DEPARTMENTS = ["총무부","교우부","새가족부","장학부","예배부","방송부","찬양부","장년교육부","유치유년부","중고등부","청년부","선교부","관리부","봉사부","재정부","장례위원회","목회실","EM"];
        
        let allReports = [];
        let currentYear = new Date().getFullYear();
        let currentMonth = String(new Date().getMonth() + 1).padStart(2, '0');

        // ─────────────────────────────────────────────
        // 초기화
        // ─────────────────────────────────────────────
        window.onload = () => {
            initOptions();
            loadReports();
        };

        function initOptions() {
            const yearSelect = document.getElementById('filter-year');
            for (let i = 2024; i <= 2027; i++) {
                const opt = document.createElement('option');
                opt.value = i; opt.innerText = i + '년';
                yearSelect.appendChild(opt);
            }
            yearSelect.value = currentYear;
            document.getElementById('filter-month').value = currentMonth;

            const deptSelect = document.getElementById('form-dept');
            deptSelect.innerHTML = '<option value="" disabled selected>부서 선택</option>';
            DEPARTMENTS.forEach(d => {
                const opt = document.createElement('option');
                opt.value = d; opt.innerText = d;
                deptSelect.appendChild(opt);
            });

            document.getElementById('form-date').value = new Date().toISOString().split('T')[0];
        }

        // ─────────────────────────────────────────────
        // [수정1] 데이터 로드 — CSV fetch 제거, google.script.run 사용
        // ─────────────────────────────────────────────
        function loadReports(callback) {
            toggleLoading(true);
            gasCall('getReports', null,
                function(data) {
                    allReports = data || [];
                    updateDashboard();
                    toggleLoading(false);
                    if (typeof callback === 'function') callback();
                },
                function(err) {
                    showToast('데이터 로드 실패: ' + (err && err.message ? err.message : String(err)));
                    toggleLoading(false);
                }
            );
        }

        // ─────────────────────────────────────────────
        // 대시보드 업데이트
        // ─────────────────────────────────────────────
        function updateDashboard() {
            document.getElementById('total-count').innerText = allReports.length;
            const prefix = `${currentYear}-${currentMonth}`;
            const monthReps = allReports.filter(r => String(r.date).startsWith(prefix));
            document.getElementById('month-count').innerText = monthReps.length;

            const depts = [...new Set(monthReps.map(r => r.dept))]
                .sort((a, b) => DEPARTMENTS.indexOf(a) - DEPARTMENTS.indexOf(b));
            const container = document.getElementById('active-depts');
            container.innerHTML = depts.map(d =>
                `<button data-dept="${d}" class="dept-action-btn bg-white text-indigo-600 text-[11px] font-black px-3 py-1.5 rounded-xl border border-indigo-200 hover:bg-indigo-50 hover:border-indigo-400 transition shadow-sm">${d}</button>`
            ).join('') || '<span class="text-xs text-slate-300 italic">제출 없음</span>';

            // 부서 버튼 클릭 이벤트 (모바일 호환)
            container.querySelectorAll('.dept-action-btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    searchByDept(this.getAttribute('data-dept'));
                });
            });

        // ─────────────────────────────────────────────
        // [수정2] 폼 제출 — google.script.run으로 실제 저장
        // ─────────────────────────────────────────────
        function submitForm(e) {
            e.preventDefault();

            const cleanText = (val) => {
                const t = val.trim();
                return (t === '1.' || t === '1. ') ? '' : t;
            };

            const idVal = document.getElementById('form-id').value;

            function doSave(password) {
                const formData = {
                    id: idVal ? parseInt(idVal) : null,
                    dept: document.getElementById('form-dept').value,
                    writer: document.getElementById('form-writer').value,
                    date: document.getElementById('form-date').value,
                    activity: cleanText(document.getElementById('form-activity').value),
                    plans: cleanText(document.getElementById('form-plans').value),
                    prayer: cleanText(document.getElementById('form-prayer').value),
                    password: idVal ? undefined : (password || '')
                };
                toggleLoading(true);
                gasCall('saveReport', formData,
                    function(result) {
                        toggleLoading(false);
                        if (result && result.success) {
                            const wasEdit = !!idVal;
                            const savedDept = formData.dept;
                            showToast(wasEdit ? '보고서가 수정되었습니다!' : '보고서가 제출되었습니다!');
                            toggleWriteForm(false);
                            loadReports(function() {
                                if (savedDept) {
                                    document.getElementById('search').value = savedDept;
                                    handleSearch(savedDept);
                                }
                            });
                        } else {
                            showToast('저장 실패: ' + (result ? result.error : '알 수 없는 오류'));
                        }
                    },
                    function(err) {
                        toggleLoading(false);
                        showToast('저장 실패: ' + (err && err.message ? err.message : String(err)));
                    }
                );
            }

            // 수정 시에는 암호 모달 없이 바로 저장
            if (idVal) { doSave(); return; }

            // 신규 저장: 암호 설정 모달 표시
            showPwModal('암호 설정 (선택)', '건너뛰기', function(pw) { doSave(pw); });
        }

        // ─────────────────────────────────────────────
        // [수정3] 삭제 기능
        // ─────────────────────────────────────────────
        function deleteReport(id) {
            if (!confirm('이 보고서를 삭제하시겠습니까?')) return;
            const r = allReports.find(rep => String(rep.id) === String(id));

            function doDelete() {
                toggleLoading(true);
                gasCall('deleteReport', { id: id },
                    function(result) {
                        toggleLoading(false);
                        if (result && result.success) {
                            showToast('삭제되었습니다.');
                            document.getElementById('search').value = '';
                            document.getElementById('date-selection-area').classList.add('hidden');
                            document.getElementById('search-result-area').innerHTML = `
                                <div class="text-center py-24 bg-white/50 rounded-3xl border border-dashed border-slate-300">
                                    <i class="fas fa-search text-slate-300 text-5xl mb-6"></i>
                                    <p class="text-slate-500 font-bold text-lg">검색어를 입력하거나 상단 부서 버튼을 클릭해 보고서를 조회하세요.</p>
                                </div>`;
                            loadReports();
                        } else {
                            showToast('삭제 실패: ' + (result ? result.error : '알 수 없는 오류'));
                        }
                    },
                    function(err) {
                        toggleLoading(false);
                        showToast('삭제 실패: ' + (err && err.message ? err.message : String(err)));
                    }
                );
            }

            if (!r || !r.hasPassword) { doDelete(); return; }

            showPwModal('삭제 암호 확인', null, function() { doDelete(); }, id);
        }

        // ─────────────────────────────────────────────
        // 암호 확인 모달 헬퍼
        // ─────────────────────────────────────────────
        var _pwModalCallback = null;
        var _pwModalSkip = null;
        var _pwModalVerifyId = null;

        function showPwModal(title, skipOrCancel, callback, verifyId) {
            // skipOrCancel: 문자열이면 "건너뛰기" 버튼 텍스트(신규저장용), 없으면 일반 취소
            _pwModalCallback = callback;
            _pwModalSkip = (typeof skipOrCancel === 'string') ? skipOrCancel : null;
            _pwModalVerifyId = verifyId || null;
            document.getElementById('pw-modal-title').innerText = title;
            var subtitle = document.getElementById('pw-modal-subtitle');
            var cancelBtn = document.getElementById('pw-modal-cancel-btn');
            if (_pwModalSkip) {
                subtitle.innerText = '암호를 설정하면 수정·삭제 시 필요합니다. 건너뛰면 암호 없이 저장됩니다.';
                cancelBtn.innerText = _pwModalSkip;
            } else {
                subtitle.innerText = '이 보고서는 암호가 설정되어 있습니다.';
                cancelBtn.innerText = '취소';
            }
            document.getElementById('pw-modal-input').value = '';
            document.getElementById('pw-modal-error').classList.add('hidden');
            document.getElementById('pw-modal-input').classList.remove('border-red-400');
            document.getElementById('pw-modal-input').placeholder = _pwModalSkip ? '암호 입력 (선택 사항)' : '암호를 입력하세요';
            document.getElementById('pw-modal').classList.remove('hidden');
            setTimeout(function() { document.getElementById('pw-modal-input').focus(); }, 50);
        }

        function pwModalConfirm() {
            var pw = document.getElementById('pw-modal-input').value;
            // 건너뛰기 모드(신규저장) 또는 검증 불필요 → 바로 콜백
            if (_pwModalSkip !== null || !_pwModalVerifyId) {
                document.getElementById('pw-modal').classList.add('hidden');
                if (typeof _pwModalCallback === 'function') _pwModalCallback(pw);
                _pwModalCallback = null;
                _pwModalSkip = null;
                _pwModalVerifyId = null;
                return;
            }
            // 검증 필요: 서버에서 확인 후 결과에 따라 처리
            toggleLoading(true);
            gasCall('verifyPassword', { id: _pwModalVerifyId, password: pw },
                function(res) {
                    toggleLoading(false);
                    if (res && res.success) {
                        document.getElementById('pw-modal').classList.add('hidden');
                        var cb = _pwModalCallback;
                        _pwModalCallback = null;
                        _pwModalVerifyId = null;
                        if (typeof cb === 'function') cb(pw);
                    } else {
                        document.getElementById('pw-modal-error').classList.remove('hidden');
                        var inp = document.getElementById('pw-modal-input');
                        inp.classList.add('border-red-400');
                        inp.value = '';
                        inp.focus();
                    }
                },
                function(err) {
                    toggleLoading(false);
                    document.getElementById('pw-modal-error').classList.remove('hidden');
                    document.getElementById('pw-modal-input').value = '';
                    document.getElementById('pw-modal-input').focus();
                }
            );
        }

        function pwModalCancel() {
            document.getElementById('pw-modal').classList.add('hidden');
            document.getElementById('pw-modal-error').classList.add('hidden');
            document.getElementById('pw-modal-input').classList.remove('border-red-400');
            // 건너뛰기 모드면 빈 암호로 콜백 실행 (암호 없이 저장)
            if (_pwModalSkip && typeof _pwModalCallback === 'function') {
                _pwModalCallback('');
            }
            _pwModalCallback = null;
            _pwModalSkip = null;
            _pwModalVerifyId = null;
        }

        // ─────────────────────────────────────────────
        // [수정4] 수정 버튼 — 폼에 기존 데이터 채우기
        // ─────────────────────────────────────────────
        function editReport(id) {
            const r = allReports.find(rep => String(rep.id) === String(id));
            if (!r) return;

            function doEdit() {
                toggleWriteForm(true);
                document.getElementById('form-id').value = r.id;
                document.getElementById('form-dept').value = r.dept;
                document.getElementById('form-writer').value = r.writer;
                document.getElementById('form-date').value = r.date;
                document.getElementById('form-activity').value = r.activity || '';
                document.getElementById('form-plans').value = r.plans || '';
                document.getElementById('form-prayer').value = r.prayer || '';
                document.getElementById('submit-btn').innerText = '보고서 수정하기';
                document.querySelectorAll('.auto-resize-textarea').forEach(ta => handleTextareaInput(ta));
            }

            if (!r.hasPassword) { doEdit(); return; }

            showPwModal('수정 암호 확인', null, function() { doEdit(); }, id);
        }

        // ─────────────────────────────────────────────
        // 검색 및 렌더링
        // ─────────────────────────────────────────────
        function toggleWriteForm(show) {
            const formArea = document.getElementById('write-form-area');
            const resultArea = document.getElementById('search-result-area');
            const dateArea = document.getElementById('date-selection-area');
            const searchBar = document.getElementById('search-bar-container');

                formArea.classList.remove('hidden');

                dateArea.classList.add('hidden');
                searchBar.classList.add('hidden');

                if (!document.getElementById('form-id').value) {
                    document.getElementById('report-form').reset();
                    document.getElementById('form-date').value = new Date().toISOString().split('T')[0];
                    document.getElementById('submit-btn').innerText = '보고서 제출하기';
                    document.querySelectorAll('.auto-resize-textarea').forEach(ta => ta.style.height = '100px');
                }
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                document.getElementById('form-id').value = '';
                document.getElementById('submit-btn').innerText = '보고서 제출하기';
                formArea.classList.add('hidden');
                resultArea.classList.remove('hidden');
                searchBar.classList.remove('hidden');
                handleSearch('');
            }

        function searchByDept(name) {
            document.getElementById('search').value = name;
            document.querySelectorAll('.dept-action-btn').forEach(btn => btn.classList.remove('dept-btn-active'));
            const btn = document.querySelector(`.dept-action-btn[data-dept="${name}"]`);
            if (btn) btn.classList.add('dept-btn-active');
            handleSearch(name);
            document.getElementById('search-bar-container').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function handleSearch(term) {
            const trimmed = term.toLowerCase().trim();
            const dateArea = document.getElementById('date-selection-area');
            const resultArea = document.getElementById('search-result-area');
            document.getElementById('write-form-area').classList.add('hidden');

            if (!trimmed) {
                dateArea.classList.add('hidden');
                resultArea.innerHTML = `
                    <div class="text-center py-24 bg-white/50 rounded-3xl border border-dashed border-slate-300">
                        <i class="fas fa-search text-slate-300 text-5xl mb-6"></i>
                        <p class="text-slate-500 font-bold text-lg">검색어를 입력하거나 상단 부서 버튼을 클릭해 보고서를 조회하세요.</p>
                    </div>`;
                document.querySelectorAll('.dept-action-btn').forEach(btn => btn.classList.remove('dept-btn-active'));
                return;
            }

            const filtered = allReports.filter(r =>
                (r.dept && r.dept.toLowerCase().includes(trimmed)) ||
                (r.writer && r.writer.toLowerCase().includes(trimmed))
            );

            if (filtered.length === 0) {
                dateArea.classList.add('hidden');
                resultArea.innerHTML = `<div class="text-center py-20 bg-white rounded-3xl border border-dashed border-slate-200"><p class="text-slate-400 font-medium">검색 결과가 없습니다.</p></div>`;
                return;
            }

            const sorted = filtered.sort((a, b) => new Date(b.date) - new Date(a.date));
            dateArea.classList.remove('hidden');
            dateArea.innerHTML = sorted.map((r, idx) =>
                `<button data-idx="${idx}" class="date-chip px-4 py-2 bg-white border border-slate-200 rounded-xl text-xs font-bold shadow-sm hover:border-indigo-400 hover:text-indigo-600 transition">
                    ${String(r.date).split(' ')[0]} - ${r.dept}
                </button>`
            ).join('');

            // 날짜 칩 클릭 이벤트 (모바일 호환)
            dateArea.querySelectorAll('.date-chip').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    const idx = parseInt(this.getAttribute('data-idx'));
                    renderDetail(sorted[idx]);
                });
            });

            renderDetail(sorted[0]);
        }

        function exportToGoogleDocs() {

        // ─────────────────────────────────────────────
        // 유틸리티
        // ─────────────────────────────────────────────
        function formatToList(text) {
            if (!text || text.trim() === '' || text === 'undefined') return null;
            const lines = text.split('\n')
                .map(l => l.trim())
                .filter(l => l !== '' && !/^\d+[\.\)]\s*$/.test(l)); // 숫자+점만 있는 줄 제거
            if (lines.length === 0) return null;
            const items = lines.map(l => l.replace(/^\d+[\.\)]\s*/, '').trim()).filter(l => l !== '');
            if (items.length === 0) return null;
            return items.map(l => `<li>${l}</li>`).join('');
        }

        function handleTextareaFocus(el) {
            if (el.value.trim() === '') {
                el.value = '1. ';
                handleTextareaInput(el);
            }
        }

        function handleTextareaInput(el) {
            el.style.height = 'auto';
            el.style.height = el.scrollHeight + 'px';
        }

        function handleTextareaKeydown(e, el) {
            if (e.key === 'Enter') {
                e.preventDefault();
                const cursorPos = el.selectionStart;
                const textBefore = el.value.substring(0, cursorPos);
                const textAfter = el.value.substring(cursorPos);
                const lines = textBefore.split('\n');
                const lastLine = lines[lines.length - 1];
                const match = lastLine.match(/^(\d+)\.\s*/);
                const nextNum = match ? parseInt(match[1]) + 1 : lines.length + 1;
                const insertText = `\n${nextNum}. `;
                el.value = textBefore + insertText + textAfter;
                const newPos = cursorPos + insertText.length;
                el.setSelectionRange(newPos, newPos);
                handleTextareaInput(el);
            }
            if (e.key === 'Backspace' && el.value.trim() === '1.') {
                el.value = '';
            }
        }

            // 월별 모달 닫기

            currentMonthlyYear = '';

        function cancelMonthlyReport() {

            document.getElementById('dashboard').classList.remove('hidden');
            document.getElementById('search').value = '';
            document.querySelectorAll('.dept-action-btn').forEach(btn => btn.classList.remove('dept-btn-active'));
            document.getElementById('date-selection-area').classList.add('hidden');
            document.getElementById('search-result-area').innerHTML = `
                <div class="text-center py-24 bg-white/50 rounded-3xl border border-dashed border-slate-300">
                    <i class="fas fa-search text-slate-300 text-5xl mb-6"></i>
                    <p class="text-slate-500 font-bold text-lg">검색어를 입력하거나 상단 부서 버튼을 클릭해 보고서를 조회하세요.</p>
                </div>`;
        }

        function toggleMonthlyModal(force) {
            const modal = document.getElementById('monthly-modal');
            const shouldShow = (typeof force === 'boolean') ? force : modal.classList.contains('hidden');
            modal.classList.toggle('hidden', !shouldShow);
        }

        function toggleLoading(show) {
            document.getElementById('loading').style.display = show ? 'flex' : 'none';
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.replace('opacity-0', 'opacity-100');
            t.classList.replace('translate-y-4', 'translate-y-0');
            setTimeout(() => {
                t.classList.replace('opacity-100', 'opacity-0');
                t.classList.replace('translate-y-0', 'translate-y-4');
            }, 3000);
        }
    </script>
</body>
</html>
