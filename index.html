<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCPC 부서별 보고서 관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.8); display: flex; justify-content: center;
            align-items: center; z-index: 9999; display: none;
        }
    </style>
</head>
<body class="text-slate-800">

    <div id="loading" class="loading-overlay">
        <div class="flex flex-col items-center">
            <i class="fas fa-circle-notch fa-spin text-blue-600 text-4xl mb-2"></i>
            <p class="font-medium">데이터 처리 중...</p>
        </div>
    </div>

    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-2">
                    <div class="bg-blue-600 p-2 rounded-lg">
                        <i class="fas fa-church text-white"></i>
                    </div>
                    <span class="text-xl font-bold tracking-tight">CCPC <span class="text-blue-600">Reports</span></span>
                </div>
                <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium shadow-sm transition-all">
                    <i class="fas fa-plus mr-1"></i> 새 보고서 작성
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                <p class="text-slate-500 text-sm font-medium mb-1">전체 보고서 건수</p>
                <h3 class="text-3xl font-bold" id="stat-total">-</h3>
            </div>
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                <p class="text-slate-500 text-sm font-medium mb-1">등록된 부서 목록</p>
                <div id="stat-depts" class="flex flex-wrap gap-1 mt-2"></div>
            </div>
        </div>

        <div class="flex flex-col sm:flex-row gap-4 mb-6">
            <div class="relative flex-1">
                <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="searchInput" onkeyup="filterReports()" placeholder="부서명, 작성자 또는 내용 검색..." 
                    class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
        </div>

        <div id="reports-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <div id="reportModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[100] flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h2 id="modalTitle" class="text-xl font-bold text-slate-800">새 사역 보고서</h2>
                <button type="button" onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fas fa-times text-xl"></i></button>
            </div>
            <form id="reportForm" onsubmit="handleFormSubmit(event)" class="p-6 space-y-4">
                <input type="hidden" id="reportId">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">부서명</label>
                        <input type="text" id="dept" required class="w-full px-4 py-2 rounded-lg border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">작성자</label>
                        <input type="text" id="writer" required class="w-full px-4 py-2 rounded-lg border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">날짜</label>
                    <input type="date" id="date" required class="w-full px-4 py-2 rounded-lg border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">주요 활동 내용</label>
                    <textarea id="activity" rows="4" required class="w-full px-4 py-2 rounded-lg border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">다음 달 계획</label>
                        <textarea id="plans" rows="3" class="w-full px-4 py-2 rounded-lg border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">기도 제목</label>
                        <textarea id="prayer" rows="3" class="w-full px-4 py-2 rounded-lg border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                    </div>
                </div>
                <div class="pt-4 flex gap-3">
                    <button type="button" onclick="closeModal()" class="flex-1 py-3 border border-slate-200 rounded-xl font-semibold text-slate-600 hover:bg-slate-50">취소</button>
                    <button type="submit" class="flex-[2] py-3 bg-blue-600 text-white rounded-xl font-semibold hover:bg-blue-700 shadow-lg shadow-blue-200">보고서 저장하기</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let allReports = [];

        // 페이지 로드 시 데이터 초기화
        window.onload = () => {
            document.getElementById('date').value = new Date().toISOString().split('T')[0];
            loadData();
        };

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'flex' : 'none';
        }

        // 서버에서 데이터 가져오기
        function loadData() {
            showLoading(true);
            google.script.run
                .withSuccessHandler(reports => {
                    allReports = reports;
                    updateStats();
                    renderReports(reports);
                    showLoading(false);
                })
                .getReports();
        }

        // 상단 통계 업데이트
        function updateStats() {
            const depts = [...new Set(allReports.map(r => r.dept))];
            document.getElementById('stat-total').innerText = allReports.length;
            document.getElementById('stat-depts').innerHTML = depts.map(d => 
                `<span class="px-2 py-1 bg-slate-100 text-slate-600 rounded text-xs font-medium mr-1 mb-1">${d}</span>`
            ).join('');
        }

        // 보고서 그리드 렌더링 (최신순 정렬 포함)
        function renderReports(reports) {
            const grid = document.getElementById('reports-grid');
            if (reports.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-20 text-center text-slate-400">등록된 보고서가 없습니다.</div>`;
                return;
            }
            // 날짜 기준 내림차순 정렬
            const sorted = [...reports].sort((a, b) => new Date(b.date) - new Date(a.date));
            
            grid.innerHTML = sorted.map(r => `
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col h-full hover:shadow-md transition-shadow">
                    <div class="flex justify-between items-start mb-3">
                        <span class="px-2 py-1 bg-blue-50 text-blue-700 text-xs font-bold rounded">${r.dept}</span>
                        <span class="text-xs text-slate-400 font-medium">${r.date}</span>
                    </div>
                    <h4 class="font-bold text-slate-900 mb-2">${r.writer}</h4>
                    <div class="text-sm text-slate-600 line-clamp-4 mb-4 flex-1">
                        ${r.activity.replace(/\n/g, '<br>')}
                    </div>
                    <div class="flex justify-end gap-4 pt-3 border-t border-slate-50">
                        <button onclick="editReport('${r.id}')" class="text-blue-600 text-sm font-semibold hover:underline">수정</button>
                        <button onclick="confirmDelete('${r.id}')" class="text-red-500 text-sm font-semibold hover:underline">삭제</button>
                    </div>
                </div>
            `).join('');
        }

        // 필터링 기능
        function filterReports() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allReports.filter(r => 
                r.dept.toLowerCase().includes(q) || 
                r.writer.toLowerCase().includes(q) || 
                r.activity.toLowerCase().includes(q)
            );
            renderReports(filtered);
        }

        // 모달 열기/닫기
        function openModal(report = null) {
            const form = document.getElementById('reportForm');
            form.reset();
            document.getElementById('reportId').value = '';
            document.getElementById('modalTitle').innerText = '새 사역 보고서';
            
            if (report) {
                document.getElementById('reportId').value = report.id;
                document.getElementById('dept').value = report.dept;
                document.getElementById('writer').value = report.writer;
                document.getElementById('date').value = report.date;
                document.getElementById('activity').value = report.activity;
                document.getElementById('plans').value = report.plans;
                document.getElementById('prayer').value = report.prayer;
                document.getElementById('modalTitle').innerText = '사역 보고서 수정';
            } else {
                document.getElementById('date').value = new Date().toISOString().split('T')[0];
            }
            document.getElementById('reportModal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('reportModal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        // 데이터 저장 전송
        function handleFormSubmit(e) {
            e.preventDefault();
            const data = {
                id: document.getElementById('reportId').value,
                dept: document.getElementById('dept').value,
                writer: document.getElementById('writer').value,
                date: document.getElementById('date').value,
                activity: document.getElementById('activity').value,
                plans: document.getElementById('plans').value,
                prayer: document.getElementById('prayer').value
            };
            showLoading(true);
            google.script.run
                .withSuccessHandler(() => {
                    closeModal();
                    loadData();
                })
                .saveReport(data);
        }

        function editReport(id) {
            const r = allReports.find(item => String(item.id) === String(id));
            if (r) openModal(r);
        }

        function confirmDelete(id) {
            if (confirm('이 보고서를 정말로 삭제하시겠습니까?')) {
                showLoading(true);
                google.script.run
                    .withSuccessHandler(() => loadData())
                    .deleteReport(id);
            }
        }
    </script>
</body>
</html>
