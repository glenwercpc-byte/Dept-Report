<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCPC 부서별 보고서 관리 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; }
        .animate-fade-in { animation: fadeIn 0.2s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .rotate-reset { transition: transform 0.5s ease-in-out; }
        .rotating { transform: rotate(360deg); }

        .auto-list { counter-reset: item; list-style-type: none; padding-left: 0; }
        .auto-list li { display: flex; margin-bottom: 4px; line-height: 1.4; font-size: 0.85rem; }
        .auto-list li::before { 
            content: counter(item) ". "; 
            counter-increment: item; 
            font-weight: bold; 
            margin-right: 4px; 
            color: #4f46e5;
            flex-shrink: 0;
        }

        /* 인쇄 전용 스타일 */
        @media print {
            .no-print { display: none !important; }
            .print-area { display: block !important; width: 100% !important; margin: 0 !important; padding: 0 !important; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            
            /* 3열 그리드 레이아웃 강제 */
            .report-grid { 
                display: grid !important; 
                grid-template-columns: repeat(3, 1fr) !important; 
                gap: 10px !important; 
                width: 100% !important; 
            }
            
            .report-card { 
                page-break-inside: avoid !important; 
                break-inside: avoid !important; 
                border: 1px solid #e2e8f0 !important;
                height: 100% !important;
            }

            @page { size: A4 portrait; margin: 1cm; }
            body { background-color: white !important; font-size: 9pt; }
        }

        .loading-overlay, .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 9999;
            display: none; justify-content: center; align-items: center;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <!-- 로딩 오버레이 -->
    <div id="loading" class="loading-overlay">
        <div class="bg-white p-6 rounded-2xl shadow-xl flex flex-col items-center">
            <i class="fas fa-spinner fa-spin text-3xl text-indigo-500 mb-2"></i>
            <p class="font-bold text-sm text-slate-600">데이터 처리 중...</p>
        </div>
    </div>

    <!-- 날짜 선택 모달 -->
    <div id="month-picker-modal" class="modal-overlay no-print">
        <div class="bg-white p-6 rounded-2xl shadow-2xl w-80 animate-fade-in">
            <h3 class="text-lg font-bold mb-4 flex items-center gap-2 text-indigo-700">
                <i class="fas fa-calendar-alt"></i> 조회 월 선택
            </h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">년도</label>
                    <select id="select-year" class="w-full border-slate-200 rounded-lg p-2 border outline-none text-sm"></select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">월</label>
                    <select id="select-month" class="w-full border-slate-200 rounded-lg p-2 border outline-none text-sm">
                        <option value="01">1월</option><option value="02">2월</option>
                        <option value="03">3월</option><option value="04">4월</option>
                        <option value="05">5월</option><option value="06">6월</option>
                        <option value="07">7월</option><option value="08">8월</option>
                        <option value="09">9월</option><option value="10">10월</option>
                        <option value="11">11월</option><option value="12">12월</option>
                    </select>
                </div>
                <div class="flex gap-2 pt-2">
                    <button onclick="closeModal()" class="flex-1 px-4 py-2 border border-slate-200 rounded-lg hover:bg-slate-50 text-sm font-medium">취소</button>
                    <button onclick="generateMonthlySummary()" class="flex-1 px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 text-sm font-bold shadow-sm">보고서 생성</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 상단 내비게이션 -->
    <nav class="sticky top-0 z-50 no-print mt-4 px-4">
        <div class="max-w-6xl mx-auto bg-indigo-600 text-white shadow-lg rounded-xl p-3 flex justify-between items-center">
            <h1 onclick="resetView()" class="text-base font-bold flex items-center gap-2 cursor-pointer hover:text-indigo-100 transition">
                <i class="fas fa-church"></i> CCPC 보고서
            </h1>
            <div class="flex items-center gap-2">
                <button onclick="resetView()" class="group flex items-center gap-1.5 hover:text-indigo-100 transition text-xs font-medium px-2 py-1.5">
                    <i id="reset-icon" class="fas fa-redo-alt rotate-reset text-[10px]"></i>
                    초기화
                </button>
                
                <div class="flex items-center gap-2 ml-2 border-l border-indigo-500 pl-2">
                    <button onclick="openCreateForm()" class="bg-white text-indigo-700 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-indigo-50 transition shadow-sm">
                        새 보고서 작성
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-4">
        
        <!-- 대시보드 -->
        <div id="dashboard" class="grid grid-cols-2 md:grid-cols-6 gap-3 mb-6 no-print">
            <div class="bg-white p-3 md:p-4 rounded-xl shadow-sm border border-slate-100 border-l-4 border-blue-400">
                <p class="text-[9px] text-slate-500 font-bold uppercase mb-1">전체 보고서</p>
                <h2 id="total-count" class="text-xl font-bold text-slate-900 leading-tight">0</h2>
            </div>
            
            <div class="bg-white p-3 md:p-4 rounded-xl shadow-sm border border-slate-100 border-l-4 border-indigo-400">
                <p class="text-[9px] text-slate-500 font-bold uppercase mb-1">이번 달 작성</p>
                <h2 id="month-count" class="text-xl font-bold text-slate-900 leading-tight">0</h2>
            </div>
            
            <div class="col-span-2 md:col-span-4 bg-white p-3 md:p-4 rounded-xl shadow-sm border border-slate-100 border-l-4 border-orange-400">
                <div class="flex justify-between items-center mb-2">
                    <p class="text-[9px] text-slate-500 font-bold uppercase">작성 부서</p>
                    <button onclick="openMonthPicker()" class="text-[10px] font-bold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded hover:bg-indigo-600 hover:text-white transition shadow-sm border border-indigo-100">
                        <i class="fas fa-th-large mr-1"></i>월간 전체보기
                    </button>
                </div>
                <div id="active-depts" class="flex flex-wrap gap-1.5"></div>
            </div>
        </div>

        <!-- 작성 폼 섹션 -->
        <section id="section-form" class="hidden animate-fade-in no-print">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <h2 id="form-title" class="text-lg font-bold mb-5 flex items-center gap-2 text-indigo-700">
                    <i class="fas fa-edit"></i> 사역 보고서 작성
                </h2>
                <form id="report-form" class="space-y-4">
                    <input type="hidden" id="edit-id" value="">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1">부서명</label>
                            <select id="dept" class="w-full border-slate-200 rounded-lg p-2 border outline-none text-sm">
                                <option value="목회실">목회실</option><option value="총무부">총무부</option>
                                <option value="교우부">교우부</option><option value="새가족부">새가족부</option>
                                <option value="장학부">장학부</option><option value="예배부">예배부</option>
                                <option value="방송부">방송부</option><option value="찬양부">찬양부</option>
                                <option value="장년교육부">장년교육부</option><option value="유치유년부">유치유년부</option>
                                <option value="중고등부">중고등부</option><option value="청년부">청년부</option>
                                <option value="선교부">선교부</option><option value="관리부">관리부</option>
                                <option value="봉사부">봉사부</option><option value="재정부">재정부</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1">작성자</label>
                            <input type="text" id="writer" required class="w-full border-slate-200 rounded-lg p-2 border outline-none text-sm" placeholder="이름 입력">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1">날짜</label>
                            <input type="date" id="date" required class="w-full border-slate-200 rounded-lg p-2 border outline-none text-sm">
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="space-y-1">
                            <label class="block text-sm font-bold text-blue-700">이번 달 사역 활동</label>
                            <textarea id="activity" rows="6" class="auto-number-target w-full border-slate-200 rounded-lg p-3 border outline-none text-sm leading-relaxed"></textarea>
                        </div>
                        <div class="space-y-1">
                            <label class="block text-sm font-bold text-emerald-700">다음 달 사역 계획</label>
                            <textarea id="plans" rows="6" class="auto-number-target w-full border-slate-200 rounded-lg p-3 border outline-none text-sm leading-relaxed"></textarea>
                        </div>
                        <div class="space-y-1">
                            <label class="block text-sm font-bold text-violet-700">건의 및 기도제목</label>
                            <textarea id="prayer" rows="6" class="auto-number-target w-full border-slate-200 rounded-lg p-3 border outline-none text-sm leading-relaxed"></textarea>
                        </div>
                    </div>

                    <div class="flex justify-end gap-2 border-t pt-4">
                        <button type="button" onclick="showSection('list')" class="px-4 py-2 border border-slate-200 rounded-lg hover:bg-slate-50 font-medium text-sm">취소</button>
                        <button type="submit" class="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-bold shadow-sm text-sm">저장하기</button>
                    </div>
                </form>
            </div>
        </section>

        <!-- 리스트 섹션 -->
        <section id="section-list" class="animate-fade-in no-print">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-4">
                <div class="flex gap-2">
                    <div class="relative flex-grow">
                        <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                        <input type="text" id="search" placeholder="부서명 검색..." class="w-full pl-9 pr-3 py-2 border border-slate-200 rounded-lg focus:border-indigo-400 outline-none text-sm" onkeyup="if(event.key === 'Enter') executeSearch()">
                    </div>
                    <button onclick="executeSearch()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-indigo-700 transition text-sm">조회</button>
                </div>
            </div>
            
            <div id="date-selection-area" class="hidden mb-4 flex flex-wrap gap-2 overflow-x-auto pb-2"></div>
            <div id="report-detail-container"></div>
            
            <div id="empty-state" class="text-center py-16 bg-white rounded-xl border-2 border-dashed border-slate-100">
                <i class="fas fa-folder-open text-slate-200 text-4xl mb-3"></i>
                <p class="text-slate-400 text-sm px-4">조회할 부서를 검색하거나 상단 '새 보고서 작성' 버튼을 클릭하세요.</p>
            </div>
        </section>

        <!-- 월간 통합 섹션 (인쇄 최적화) -->
        <section id="section-monthly" class="hidden animate-fade-in">
            <div class="flex justify-between items-center mb-6 no-print bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <div>
                    <h2 class="text-lg font-bold text-slate-800">통합 보고서 미리보기</h2>
                    <p class="text-xs text-slate-500">인쇄 시 자동으로 3열 그리드 레이아웃으로 조정됩니다.</p>
                </div>
                <div class="flex gap-2">
                    <button onclick="window.print()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-indigo-700 transition flex items-center gap-2 text-sm">
                        <i class="fas fa-print"></i> 지금 인쇄하기
                    </button>
                    <button onclick="showSection('list')" class="bg-slate-100 text-slate-700 px-4 py-2 rounded-lg font-bold text-sm">닫기</button>
                </div>
            </div>
            <div id="monthly-report-content" class="print-area"></div>
        </section>

    </main>

    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-4 py-2 rounded-lg opacity-0 transition-opacity pointer-events-none z-[9999] shadow-lg text-xs font-medium whitespace-nowrap"></div>

    <script>
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwgw6NBQ5BKXVGfDEMEp68h7Fa6fHK50fp1pAreR2F1N68dFYL2cVJZ166XeO1vRaeNsw/exec"; 

        let allReports = [];

        window.onload = () => {
            loadReports();
            setupAutoNumbering();
            initYearPicker();
            document.getElementById('date').value = new Date().toISOString().split('T')[0];
        };

        function toggleLoading(show) {
            document.getElementById('loading').style.display = show ? 'flex' : 'none';
        }

        async function loadReports() {
            toggleLoading(true);
            const isGasEnv = typeof google !== 'undefined' && google.script && google.script.run;
            
            if (isGasEnv) {
                google.script.run.withSuccessHandler(data => {
                    allReports = data || [];
                    updateDashboard();
                    toggleLoading(false);
                }).getReports();
            } else if (GAS_WEB_APP_URL) {
                try {
                    const url = `${GAS_WEB_APP_URL}?action=getReports`;
                    const response = await fetch(url, { redirect: 'follow' });
                    const data = await response.json();
                    allReports = data || [];
                    localStorage.setItem('church_reports_v3', JSON.stringify(allReports));
                    updateDashboard();
                } catch (e) {
                    allReports = JSON.parse(localStorage.getItem('church_reports_v3')) || [];
                    updateDashboard();
                } finally {
                    toggleLoading(false);
                }
            } else {
                allReports = JSON.parse(localStorage.getItem('church_reports_v3')) || [];
                updateDashboard();
                toggleLoading(false);
            }
        }

        function updateDashboard() {
            document.getElementById('total-count').innerText = allReports.length;
            const now = new Date();
            const prefix = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
            const monthReps = allReports.filter(r => r.date && r.date.startsWith(prefix));
            document.getElementById('month-count').innerText = monthReps.length;
            
            const depts = [...new Set(monthReps.map(r => r.dept))].sort();
            document.getElementById('active-depts').innerHTML = depts.map(d => 
                `<button onclick="clickDeptChip('${d}')" class="bg-indigo-50 text-indigo-600 text-[10px] font-black px-2 py-1 rounded border border-indigo-100 hover:bg-indigo-600 hover:text-white transition">
                    ${d}
                </button>`
            ).join('') || '<span class="text-[11px] text-slate-400 italic">이번 달 작성된 보고서가 없습니다.</span>';
        }

        function initYearPicker() {
            const selectYear = document.getElementById('select-year');
            const currentYear = new Date().getFullYear();
            for(let i = currentYear; i >= 2024; i--) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.innerText = `${i}년`;
                selectYear.appendChild(opt);
            }
            document.getElementById('select-month').value = String(new Date().getMonth() + 1).padStart(2, '0');
        }

        function openMonthPicker() {
            document.getElementById('month-picker-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('month-picker-modal').style.display = 'none';
        }

        function generateMonthlySummary() {
            const year = document.getElementById('select-year').value;
            const month = document.getElementById('select-month').value;
            const prefix = `${year}-${month}`;
            
            const filtered = allReports.filter(r => r.date && r.date.startsWith(prefix)).sort((a,b) => a.dept.localeCompare(b.dept));
            
            if (!filtered.length) {
                showToast(`${year}/${month} 데이터가 존재하지 않습니다.`);
                return;
            }

            const container = document.getElementById('monthly-report-content');
            container.innerHTML = `
                <div class="text-center pb-6 border-b-4 border-indigo-600 mb-8">
                    <h1 class="text-3xl font-black text-slate-900 tracking-tight">부서별 사역 보고서 현황</h1>
                    <p class="text-lg text-indigo-600 font-bold mt-2">작성 월: ${year} / ${month}</p>
                </div>
                <div class="report-grid grid grid-cols-1 md:grid-cols-3 gap-4"></div>
            `;

            const grid = container.querySelector('.report-grid');

            filtered.forEach(r => {
                const card = document.createElement('div');
                card.className = "report-card bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col";
                card.innerHTML = `
                    <div class="border-b border-slate-100 pb-2 mb-3 flex justify-between items-end">
                        <span class="text-base font-black text-indigo-800">${r.dept}</span>
                        <span class="text-[10px] text-slate-400 font-medium">${r.writer} | ${r.date.split('-').slice(1).join('/')}</span>
                    </div>
                    <div class="space-y-3 flex-grow">
                        <div>
                            <p class="text-[10px] font-bold text-blue-600 mb-1 flex items-center gap-1"><i class="fas fa-circle text-[4px]"></i> 활동</p>
                            <ul class="auto-list">${formatToList(r.activity)}</ul>
                        </div>
                        <div>
                            <p class="text-[10px] font-bold text-emerald-600 mb-1 flex items-center gap-1"><i class="fas fa-circle text-[4px]"></i> 계획</p>
                            <ul class="auto-list">${formatToList(r.plans)}</ul>
                        </div>
                        <div>
                            <p class="text-[10px] font-bold text-slate-500 mb-1 flex items-center gap-1"><i class="fas fa-circle text-[4px]"></i> 비고</p>
                            <ul class="auto-list">${formatToList(r.prayer)}</ul>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });

            closeModal();
            showSection('monthly');
        }

        function clickDeptChip(deptName) {
            showSection('list');
            document.getElementById('search').value = deptName;
            executeSearch();
        }

        function showSection(section) {
            ['form', 'list', 'monthly'].forEach(s => {
                const el = document.getElementById(`section-${s}`);
                if (el) el.classList.add('hidden');
            });
            document.getElementById(`section-${section}`).classList.remove('hidden');
            window.scrollTo(0, 0);
        }

        function executeSearch() {
            const term = document.getElementById('search').value.toLowerCase().trim();
            if (!term) return;
            const filtered = allReports.filter(r => r.dept.includes(term));
            displaySearchList(filtered);
        }

        function displaySearchList(results) {
            const dateArea = document.getElementById('date-selection-area');
            const container = document.getElementById('report-detail-container');
            const empty = document.getElementById('empty-state');
            
            dateArea.innerHTML = '';
            container.innerHTML = '';

            if (!results.length) {
                dateArea.classList.add('hidden');
                empty.classList.remove('hidden');
                return;
            }

            empty.classList.add('hidden');
            dateArea.classList.remove('hidden');

            results.sort((a,b) => new Date(b.date) - new Date(a.date)).forEach((r, idx) => {
                const btn = document.createElement('button');
                btn.className = "flex-shrink-0 px-3 py-1.5 bg-white border border-slate-200 rounded-lg shadow-sm hover:border-indigo-400 transition text-xs font-bold text-slate-700";
                btn.innerText = r.date;
                btn.onclick = () => renderDetail(r);
                dateArea.appendChild(btn);
                if (idx === 0) renderDetail(r);
            });
        }

        function renderDetail(r) {
            const container = document.getElementById('report-detail-container');
            container.innerHTML = `
                <div class="bg-white rounded-xl shadow-md border border-slate-100 overflow-hidden animate-fade-in no-print">
                    <div class="bg-indigo-50 p-4 border-b border-indigo-100 flex justify-between items-center">
                        <h2 class="text-sm font-bold text-indigo-900">
                           <i class="fas fa-file-alt mr-1"></i> ${r.date} ${r.dept} 보고서
                        </h2>
                        <div class="flex gap-2">
                             <button onclick="editReport('${r.id}')" class="text-[11px] bg-white text-indigo-600 border border-indigo-200 px-3 py-1.5 rounded-md font-bold hover:bg-indigo-50 transition">수정</button>
                             <button onclick="deleteReport('${r.id}')" class="text-[11px] bg-white text-rose-600 border border-rose-200 px-3 py-1.5 rounded-md font-bold hover:bg-rose-50 transition">삭제</button>
                        </div>
                    </div>
                    <div class="p-5 grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="space-y-2">
                            <h4 class="text-blue-700 font-bold border-b border-blue-50 pb-1 text-xs">활동 내용</h4>
                            <ul class="auto-list">${formatToList(r.activity)}</ul>
                        </div>
                        <div class="space-y-2">
                            <h4 class="text-emerald-700 font-bold border-b border-emerald-50 pb-1 text-xs">차후 계획</h4>
                            <ul class="auto-list">${formatToList(r.plans)}</ul>
                        </div>
                        <div class="space-y-2">
                            <h4 class="text-violet-700 font-bold border-b border-violet-50 pb-1 text-xs">건의/기타</h4>
                            <ul class="auto-list">${formatToList(r.prayer)}</ul>
                        </div>
                    </div>
                </div>
            `;
        }

        function editReport(id) {
            const report = allReports.find(r => r.id === id);
            if (!report) return;

            document.getElementById('edit-id').value = report.id;
            document.getElementById('dept').value = report.dept;
            document.getElementById('writer').value = report.writer;
            document.getElementById('date').value = report.date;
            document.getElementById('activity').value = report.activity;
            document.getElementById('plans').value = report.plans;
            document.getElementById('prayer').value = report.prayer;

            document.getElementById('form-title').innerHTML = `<i class="fas fa-edit"></i> 보고서 수정 (${report.dept})`;
            showSection('form');
        }

        async function deleteReport(id) {
            if(!confirm("삭제하시겠습니까?")) return;
            toggleLoading(true);
            
            const isGas = typeof google !== 'undefined' && google.script && google.script.run;
            if (isGas) {
                google.script.run.withSuccessHandler(() => {
                    showToast("삭제되었습니다.");
                    resetView();
                }).deleteReport(id);
            } else if (GAS_WEB_APP_URL) {
                try {
                    await fetch(`${GAS_WEB_APP_URL}?action=delete&id=${id}`, { method: 'POST', mode: 'no-cors' });
                    setTimeout(resetView, 1000);
                } catch (e) {
                    showToast("오류 발생");
                } finally {
                    toggleLoading(false);
                }
            } else {
                allReports = allReports.filter(rep => rep.id !== id);
                localStorage.setItem('church_reports_v3', JSON.stringify(allReports));
                resetView();
                toggleLoading(false);
            }
        }

        function formatToList(text) {
            if (!text || !text.trim()) return '<li class="text-slate-300 italic text-[11px]">기록된 내용이 없습니다.</li>';
            return text.split('\n').filter(l => l.trim()).map(l => `<li>${l.replace(/^\d+[\.\)]\s*/, '')}</li>`).join('');
        }

        function resetView() {
            const icon = document.getElementById('reset-icon');
            if(icon) {
                icon.classList.add('rotating');
                setTimeout(() => icon.classList.remove('rotating'), 500);
            }
            document.getElementById('search').value = '';
            document.getElementById('report-detail-container').innerHTML = '';
            document.getElementById('date-selection-area').classList.add('hidden');
            document.getElementById('empty-state').classList.remove('hidden');
            showSection('list');
            loadReports();
        }

        function setupAutoNumbering() {
            document.querySelectorAll('.auto-number-target').forEach(ta => {
                ta.addEventListener('focus', function() { if(!this.value.trim()) this.value = "1. "; });
                ta.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        const pos = this.selectionStart;
                        const line = this.value.substring(0, pos).split('\n').pop();
                        const match = line.match(/^(\d+)\.\s/);
                        if (match) {
                            e.preventDefault();
                            const next = parseInt(match[1]) + 1;
                            const insert = `\n${next}. `;
                            this.value = this.value.substring(0, pos) + insert + this.value.substring(pos);
                            this.setSelectionRange(pos + insert.length, pos + insert.length);
                        }
                    }
                });
            });
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.replace('opacity-0', 'opacity-100');
            setTimeout(() => t.classList.replace('opacity-100', 'opacity-0'), 2000);
        }

        function openCreateForm() {
            document.getElementById('report-form').reset();
            document.getElementById('edit-id').value = '';
            document.getElementById('form-title').innerHTML = `<i class="fas fa-edit"></i> 사역 보고서 작성`;
            document.getElementById('date').value = new Date().toISOString().split('T')[0];
            showSection('form');
        }

        document.getElementById('report-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            toggleLoading(true);
            
            const editId = document.getElementById('edit-id').value;
            const data = {
                id: editId || "ID_" + Date.now(),
                dept: document.getElementById('dept').value,
                writer: document.getElementById('writer').value,
                date: document.getElementById('date').value,
                activity: document.getElementById('activity').value,
                plans: document.getElementById('plans').value,
                prayer: document.getElementById('prayer').value
            };
            
            const isGas = typeof google !== 'undefined' && google.script && google.script.run;
            
            try {
                if (isGas) {
                    google.script.run.withSuccessHandler(() => {
                        showToast('저장 성공');
                        resetView();
                    }).saveReport(data);
                } else if (GAS_WEB_APP_URL) {
                    await fetch(`${GAS_WEB_APP_URL}`, {
                        method: 'POST',
                        mode: 'no-cors',
                        body: JSON.stringify({ action: 'save', ...data })
                    });
                    setTimeout(resetView, 1000);
                } else {
                    let list = JSON.parse(localStorage.getItem('church_reports_v3')) || [];
                    if (editId) list = list.filter(r => r.id !== editId);
                    list.unshift(data);
                    localStorage.setItem('church_reports_v3', JSON.stringify(list));
                    resetView();
                }
            } catch (err) {
                showToast('저장 오류');
            } finally {
                toggleLoading(false);
            }
        });
    </script>
</body>
</html>
