<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCPC 부서별 보고서 관리 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; }
        .animate-fade-in { animation: fadeIn 0.2s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .rotate-reset { transition: transform 0.5s ease-in-out; }
        .rotating { transform: rotate(360deg); }

        .auto-list { counter-reset: item; list-style-type: none; padding-left: 0; }
        .auto-list li { display: flex; margin-bottom: 6px; line-height: 1.5; font-size: 0.95rem; }
        .auto-list li::before { 
            content: counter(item) ". "; 
            counter-increment: item; 
            font-weight: bold; 
            margin-right: 8px; 
            color: #6366f1;
            flex-shrink: 0;
        }

        @media print {
            .no-print { display: none !important; }
            .print-area { display: block !important; width: 100% !important; margin: 0 !important; padding: 0 !important; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .print-grid { display: grid !important; grid-template-columns: 1fr 1fr 1fr !important; gap: 15px !important; width: 100% !important; }
            .break-inside-avoid { page-break-inside: avoid !important; break-inside: avoid !important; margin-bottom: 1.5rem !important; display: block !important; }
            @page { size: A4 portrait; margin: 1.2cm; }
            body { background-color: white !important; font-size: 10pt; }
        }

        .loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.8); z-index: 9999;
            display: none; justify-content: center; align-items: center;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <div id="loading" class="loading-overlay">
        <div class="flex flex-col items-center">
            <i class="fas fa-spinner fa-spin text-3xl text-indigo-500 mb-2"></i>
            <p class="font-bold text-sm text-slate-600">데이터 처리 중...</p>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="sticky top-0 z-50 no-print mt-4 px-4">
        <div class="max-w-6xl mx-auto bg-indigo-600 text-white shadow-lg rounded-xl p-3 flex justify-between items-center">
            <h1 onclick="resetView()" class="text-base font-bold flex items-center gap-2 cursor-pointer hover:text-indigo-100 transition">
                <i class="fas fa-church"></i> CCPC 보고서
            </h1>
            <div class="flex items-center gap-2">
                <button onclick="resetView()" class="group flex items-center gap-1.5 hover:text-indigo-100 transition text-xs font-medium px-2 py-1.5">
                    <i id="reset-icon" class="fas fa-redo-alt rotate-reset text-[10px]"></i>
                    초기화
                </button>
                
                <div class="flex items-center gap-2 ml-2 border-l border-indigo-500 pl-2">
                    <button onclick="openCreateForm()" class="bg-white text-indigo-700 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-indigo-50 transition shadow-sm">
                        작성
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-4">
        
        <!-- Dashboard: Responsive Layout -->
        <!-- Mobile: 2 cols (Numbers first row, Depts second row) -->
        <!-- Desktop: 6 cols (Numbers 1:1, Depts 4) -->
        <div id="dashboard" class="grid grid-cols-2 md:grid-cols-6 gap-3 mb-6 no-print">
            <!-- Total Reports (Mobile: 1/2 width, Desktop: 1/6 width) -->
            <div class="bg-white p-3 md:p-4 rounded-xl shadow-sm border border-slate-100 border-l-4 md:border-l-8 border-blue-400">
                <p class="text-[9px] md:text-[10px] text-slate-500 font-bold uppercase tracking-tight mb-1">전체 보고서</p>
                <h2 id="total-count" class="text-xl md:text-2xl font-bold text-slate-900 leading-tight">0</h2>
            </div>
            
            <!-- Monthly Count (Mobile: 1/2 width, Desktop: 1/6 width) -->
            <div class="bg-white p-3 md:p-4 rounded-xl shadow-sm border border-slate-100 border-l-4 md:border-l-8 border-indigo-400">
                <p class="text-[9px] md:text-[10px] text-slate-500 font-bold uppercase tracking-tight mb-1">이번 달 작성</p>
                <h2 id="month-count" class="text-xl md:text-2xl font-bold text-slate-900 leading-tight">0</h2>
            </div>
            
            <!-- Active Departments List (Mobile: Full width below, Desktop: 4/6 width) -->
            <div class="col-span-2 md:col-span-4 bg-white p-3 md:p-4 rounded-xl shadow-sm border border-slate-100 border-l-4 md:border-l-8 border-orange-400">
                <div class="flex justify-between items-center mb-2">
                    <p class="text-[9px] md:text-[10px] text-slate-500 font-bold uppercase tracking-tight">이번 달 작성 부서 목록</p>
                    <button onclick="showMonthlySummary()" class="text-[9px] font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded md:hidden">전체보기</button>
                </div>
                <div id="active-depts" class="flex flex-wrap gap-1.5"></div>
            </div>
        </div>

        <!-- Section: Report Form -->
        <section id="section-form" class="hidden animate-fade-in no-print">
            <div class="bg-white p-5 md:p-6 rounded-xl shadow-sm border border-slate-200">
                <h2 id="form-title" class="text-lg font-bold mb-5 flex items-center gap-2 text-indigo-700">
                    <i class="fas fa-edit"></i> 사역 보고서 작성
                </h2>
                <form id="report-form" class="space-y-4">
                    <input type="hidden" id="edit-id" value="">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1">부서명</label>
                            <select id="dept" class="w-full border-slate-200 rounded-lg p-2 border focus:ring-1 focus:ring-indigo-500 outline-none text-sm">
                                <option value="목회실">목회실</option>
                                <option value="총무부">총무부</option>
                                <option value="교우부">교우부</option>
                                <option value="새가족부">새가족부</option>
                                <option value="장학부">장학부</option>
                                <option value="예배부">예배부</option>
                                <option value="방송부">방송부</option>
                                <option value="찬양부">찬양부</option>
                                <option value="장년교육부">장년교육부</option>
                                <option value="유치유년부">유치유년부</option>
                                <option value="중고등부">중고등부</option>
                                <option value="청년부">청년부</option>
                                <option value="선교부">선교부</option>
                                <option value="관리부">관리부</option>
                                <option value="봉사부">봉사부</option>
                                <option value="재정부">재정부</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1">작성자</label>
                            <input type="text" id="writer" required class="w-full border-slate-200 rounded-lg p-2 border focus:ring-1 focus:ring-indigo-500 outline-none text-sm" placeholder="이름 입력">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1">날짜</label>
                            <input type="date" id="date" required class="w-full border-slate-200 rounded-lg p-2 border focus:ring-1 focus:ring-indigo-500 outline-none text-sm">
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="space-y-1.5">
                            <label class="block text-sm font-bold text-blue-700">이번 달 사역 활동</label>
                            <textarea id="activity" rows="6" class="auto-number-target w-full border-slate-200 rounded-lg p-3 border focus:ring-1 focus:ring-blue-400 outline-none text-sm leading-relaxed" placeholder="1. 활동 내용을 적어주세요."></textarea>
                        </div>
                        <div class="space-y-1.5">
                            <label class="block text-sm font-bold text-emerald-700">다음 달 사역 계획</label>
                            <textarea id="plans" rows="6" class="auto-number-target w-full border-slate-200 rounded-lg p-3 border focus:ring-1 focus:ring-emerald-400 outline-none text-sm leading-relaxed" placeholder="1. 계획을 적어주세요."></textarea>
                        </div>
                        <div class="space-y-1.5">
                            <label class="block text-sm font-bold text-violet-700">기타 및 건의사항</label>
                            <textarea id="prayer" rows="6" class="auto-number-target w-full border-slate-200 rounded-lg p-3 border focus:ring-1 focus:ring-violet-400 outline-none text-sm leading-relaxed" placeholder="건의 및 기도제목"></textarea>
                        </div>
                    </div>

                    <div class="flex justify-end gap-2 border-t pt-4">
                        <button type="button" onclick="showSection('list')" class="px-4 py-2 border border-slate-200 rounded-lg hover:bg-slate-50 font-medium text-sm">취소</button>
                        <button type="submit" class="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-bold shadow-sm text-sm">보고서 저장</button>
                    </div>
                </form>
            </div>
        </section>

        <!-- Section: List -->
        <section id="section-list" class="animate-fade-in no-print">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-4">
                <div class="flex gap-2">
                    <div class="relative flex-grow">
                        <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                        <input type="text" id="search" placeholder="부서명 또는 작성자 검색..." class="w-full pl-9 pr-3 py-2 border border-slate-200 rounded-lg focus:border-indigo-400 outline-none text-sm" onkeyup="if(event.key === 'Enter') executeSearch()">
                    </div>
                    <button onclick="executeSearch()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-indigo-700 transition text-sm">조회</button>
                </div>
            </div>
            
            <div id="date-selection-area" class="hidden mb-4 flex flex-wrap gap-2 overflow-x-auto pb-2"></div>
            <div id="report-detail-container"></div>
            
            <div id="empty-state" class="text-center py-16 bg-white rounded-xl border-2 border-dashed border-slate-100">
                <i class="fas fa-folder-open text-slate-200 text-4xl mb-3"></i>
                <p class="text-slate-400 text-sm px-4">조회할 부서를 검색하거나 상단 '작성' 버튼을 클릭하세요.</p>
            </div>
        </section>

        <!-- Section: Monthly (Print) -->
        <section id="section-monthly" class="hidden animate-fade-in">
            <div class="flex justify-between items-center mb-5 no-print">
                <h2 class="text-lg font-bold text-slate-800">월간 통합 보고서</h2>
                <div class="flex gap-2">
                    <button onclick="window.print()" class="bg-indigo-600 text-white px-3 py-1.5 rounded-lg font-bold hover:bg-indigo-700 transition flex items-center gap-2 text-xs">
                        <i class="fas fa-print"></i> 인쇄 / PDF
                    </button>
                    <button onclick="showSection('list')" class="bg-slate-100 text-slate-700 px-3 py-1.5 rounded-lg font-bold text-xs">닫기</button>
                </div>
            </div>
            <div id="monthly-report-content" class="print-area space-y-6"></div>
        </section>

    </main>

    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-4 py-2 rounded-lg opacity-0 transition-opacity pointer-events-none z-[9999] shadow-lg text-xs font-medium whitespace-nowrap"></div>

    <script>
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwgw6NBQ5BKXVGfDEMEp68h7Fa6fHK50fp1pAreR2F1N68dFYL2cVJZ166XeO1vRaeNsw/exec"; 

        let allReports = [];

        window.onload = () => {
            loadReports();
            setupAutoNumbering();
            document.getElementById('date').value = new Date().toISOString().split('T')[0];
        };

        function toggleLoading(show) {
            document.getElementById('loading').style.display = show ? 'flex' : 'none';
        }

        async function loadReports() {
            toggleLoading(true);
            const isGasEnv = typeof google !== 'undefined' && google.script && google.script.run;
            
            if (isGasEnv) {
                google.script.run.withSuccessHandler(data => {
                    allReports = data || [];
                    updateDashboard();
                    toggleLoading(false);
                }).getReports();
            } else if (GAS_WEB_APP_URL) {
                try {
                    const url = `${GAS_WEB_APP_URL}?action=getReports`;
                    const response = await fetch(url, { redirect: 'follow' });
                    if (!response.ok) throw new Error("Network response was not ok");
                    
                    const data = await response.json();
                    allReports = data || [];
                    localStorage.setItem('church_reports_v2', JSON.stringify(allReports));
                    updateDashboard();
                } catch (e) {
                    console.warn("API 연동 시도 실패:", e);
                    allReports = JSON.parse(localStorage.getItem('church_reports_v2')) || [];
                    updateDashboard();
                } finally {
                    toggleLoading(false);
                }
            } else {
                allReports = JSON.parse(localStorage.getItem('church_reports_v2')) || [];
                updateDashboard();
                toggleLoading(false);
            }
        }

        function updateDashboard() {
            document.getElementById('total-count').innerText = allReports.length;
            const now = new Date();
            const prefix = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
            const monthReps = allReports.filter(r => r.date && r.date.startsWith(prefix));
            document.getElementById('month-count').innerText = monthReps.length;
            
            const depts = [...new Set(monthReps.map(r => r.dept))].sort();
            document.getElementById('active-depts').innerHTML = depts.map(d => 
                `<button onclick="clickDeptChip('${d}')" class="bg-indigo-50 text-indigo-600 text-[10px] font-black px-2 py-1 rounded border border-indigo-100 hover:bg-indigo-600 hover:text-white transition cursor-pointer">
                    ${d}
                </button>`
            ).join('') || '<span class="text-[11px] text-slate-400 italic font-medium">이번 달 기록 없음</span>';
        }

        function clickDeptChip(deptName) {
            showSection('list');
            document.getElementById('search').value = deptName;
            executeSearch();
            showToast(`${deptName} 조회 중...`);
        }

        function showSection(section) {
            ['form', 'list', 'monthly'].forEach(s => {
                const el = document.getElementById(`section-${s}`);
                if (el) el.classList.add('hidden');
            });
            document.getElementById(`section-${section}`).classList.remove('hidden');
            window.scrollTo(0, 0);
        }

        function executeSearch() {
            const term = document.getElementById('search').value.toLowerCase().trim();
            if (!term) return;
            const filtered = allReports.filter(r => r.dept.includes(term) || (r.writer && r.writer.includes(term)));
            displaySearchList(filtered);
        }

        function displaySearchList(results) {
            const dateArea = document.getElementById('date-selection-area');
            const container = document.getElementById('report-detail-container');
            const empty = document.getElementById('empty-state');
            
            dateArea.innerHTML = '';
            container.innerHTML = '';

            if (!results.length) {
                dateArea.classList.add('hidden');
                empty.classList.remove('hidden');
                return;
            }

            empty.classList.add('hidden');
            dateArea.classList.remove('hidden');

            results.sort((a,b) => new Date(b.date) - new Date(a.date)).forEach((r, idx) => {
                const btn = document.createElement('button');
                btn.className = "flex-shrink-0 px-3 py-1.5 bg-white border border-slate-200 rounded-lg shadow-sm hover:border-indigo-400 transition text-xs font-bold text-slate-700 whitespace-nowrap";
                btn.innerText = `${r.date} (${r.dept})`;
                btn.onclick = () => renderDetail(r);
                dateArea.appendChild(btn);
                if (idx === 0) renderDetail(r);
            });
        }

        function renderDetail(r) {
            const container = document.getElementById('report-detail-container');
            container.innerHTML = `
                <div class="bg-white rounded-xl shadow-md border border-slate-100 overflow-hidden animate-fade-in no-print">
                    <div class="bg-indigo-100 p-3 md:p-4 border-b border-indigo-200 flex flex-col md:flex-row gap-2 justify-between md:items-center">
                        <h2 class="text-xs md:text-sm font-bold text-indigo-900">
                           <i class="fas fa-file-alt mr-1"></i> ${r.date} ${r.dept} 보고서 <span class="hidden md:inline mx-2 text-indigo-300">|</span> <span class="font-bold">작성: ${r.writer}</span>
                        </h2>
                        <div class="flex gap-2">
                             <button onclick="editReport('${r.id}')" class="flex-1 md:flex-none text-[10px] bg-white text-indigo-600 border border-indigo-200 hover:bg-indigo-50 px-3 py-1.5 rounded-md font-bold transition">수정</button>
                             <button onclick="deleteReport('${r.id}')" class="flex-1 md:flex-none text-[10px] bg-white text-rose-600 border border-rose-200 hover:bg-rose-50 px-3 py-1.5 rounded-md font-bold transition">삭제</button>
                        </div>
                    </div>
                    <div class="p-4 md:p-5 grid grid-cols-1 md:grid-cols-3 gap-5">
                        <div class="space-y-2">
                            <h4 class="text-blue-700 font-bold border-b border-blue-100 pb-1 flex items-center gap-1.5 text-xs"><i class="fas fa-check-circle text-[10px]"></i> 활동 내용</h4>
                            <ul class="auto-list">${formatToList(r.activity)}</ul>
                        </div>
                        <div class="space-y-2">
                            <h4 class="text-emerald-700 font-bold border-b border-emerald-100 pb-1 flex items-center gap-1.5 text-xs"><i class="fas fa-arrow-right text-[10px]"></i> 차후 계획</h4>
                            <ul class="auto-list">${formatToList(r.plans)}</ul>
                        </div>
                        <div class="space-y-2">
                            <h4 class="text-violet-700 font-bold border-b border-violet-100 pb-1 flex items-center gap-1.5 text-xs"><i class="fas fa-lightbulb text-[10px]"></i> 건의/기타</h4>
                            <ul class="auto-list">${formatToList(r.prayer)}</ul>
                        </div>
                    </div>
                </div>
            `;
            container.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function editReport(id) {
            const report = allReports.find(r => r.id === id);
            if (!report) return;

            document.getElementById('edit-id').value = report.id;
            document.getElementById('dept').value = report.dept;
            document.getElementById('writer').value = report.writer;
            document.getElementById('date').value = report.date;
            document.getElementById('activity').value = report.activity;
            document.getElementById('plans').value = report.plans;
            document.getElementById('prayer').value = report.prayer;

            document.getElementById('form-title').innerHTML = `<i class="fas fa-edit"></i> 보고서 수정 (${report.dept})`;
            
            showSection('form');
            showToast("수정 모드");
        }

        async function deleteReport(id) {
            if(!confirm("이 보고서를 삭제하시겠습니까?")) return;
            toggleLoading(true);
            
            const isGas = typeof google !== 'undefined' && google.script && google.script.run;
            if (isGas) {
                google.script.run.withSuccessHandler(() => {
                    showToast("삭제되었습니다.");
                    resetView();
                }).deleteReport(id);
            } else if (GAS_WEB_APP_URL) {
                try {
                    await fetch(`${GAS_WEB_APP_URL}?action=delete&id=${id}`, { 
                        method: 'POST',
                        mode: 'no-cors' 
                    });
                    showToast("삭제 요청 완료");
                    setTimeout(resetView, 1500);
                } catch (e) {
                    showToast("오류 발생");
                } finally {
                    toggleLoading(false);
                }
            } else {
                allReports = allReports.filter(rep => rep.id !== id);
                localStorage.setItem('church_reports_v2', JSON.stringify(allReports));
                showToast("삭제 완료");
                resetView();
                toggleLoading(false);
            }
        }

        function formatToList(text) {
            if (!text) return '<li class="text-slate-400 italic text-xs">내용 없음</li>';
            return text.split('\n').filter(l => l.trim()).map(l => `<li>${l.replace(/^\d+[\.\)]\s*/, '')}</li>`).join('');
        }

        function showMonthlySummary() {
            const now = new Date();
            const prefix = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
            const monthReports = allReports.filter(r => r.date && r.date.startsWith(prefix)).sort((a,b) => a.dept.localeCompare(b.dept));
            
            if (!monthReports.length) {
                showToast("데이터가 없습니다.");
                return;
            }

            const container = document.getElementById('monthly-report-content');
            container.innerHTML = `<div class="text-center pb-4 border-b-2 border-indigo-500 mb-6"><h1 class="text-xl md:text-2xl font-black text-slate-900">${now.getFullYear()}년 ${now.getMonth()+1}월 통합 보고</h1></div>`;

            monthReports.forEach(r => {
                const div = document.createElement('div');
                div.className = `bg-white p-4 rounded-lg border border-slate-200 break-inside-avoid shadow-sm`;
                div.innerHTML = `
                    <div class="flex justify-between items-center border-b border-slate-100 pb-1 mb-3">
                        <h3 class="text-[11px] md:text-sm font-bold text-indigo-900">${r.date} ${r.dept} (${r.writer})</h3>
                    </div>
                    <div class="print-grid grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <p class="text-blue-700 font-bold mb-1 text-[10px]">활동</p>
                            <ul class="auto-list text-[10px]">${formatToList(r.activity)}</ul>
                        </div>
                        <div>
                            <p class="text-emerald-700 font-bold mb-1 text-[10px]">계획</p>
                            <ul class="auto-list text-[10px]">${formatToList(r.plans)}</ul>
                        </div>
                        <div>
                            <p class="text-violet-700 font-bold mb-1 text-[10px]">건의</p>
                            <ul class="auto-list text-[10px]">${formatToList(r.prayer)}</ul>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
            showSection('monthly');
        }

        function resetView() {
            const icon = document.getElementById('reset-icon');
            if(icon) {
                icon.classList.add('rotating');
                setTimeout(() => icon.classList.remove('rotating'), 500);
            }

            document.getElementById('search').value = '';
            document.getElementById('report-detail-container').innerHTML = '';
            document.getElementById('date-selection-area').classList.add('hidden');
            document.getElementById('empty-state').classList.remove('hidden');
            
            showSection('list');
            loadReports();
        }

        function setupAutoNumbering() {
            document.querySelectorAll('.auto-number-target').forEach(ta => {
                ta.addEventListener('focus', function() { if(!this.value.trim()) this.value = "1. "; });
                ta.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        const pos = this.selectionStart;
                        const line = this.value.substring(0, pos).split('\n').pop();
                        const match = line.match(/^(\d+)\.\s/);
                        if (match) {
                            e.preventDefault();
                            const next = parseInt(match[1]) + 1;
                            const insert = `\n${next}. `;
                            this.value = this.value.substring(0, pos) + insert + this.value.substring(pos);
                            this.setSelectionRange(pos + insert.length, pos + insert.length);
                        }
                    }
                });
            });
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.replace('opacity-0', 'opacity-100');
            setTimeout(() => t.classList.replace('opacity-100', 'opacity-0'), 2000);
        }

        function openCreateForm() {
            document.getElementById('report-form').reset();
            document.getElementById('edit-id').value = '';
            document.getElementById('form-title').innerHTML = `<i class="fas fa-edit"></i> 사역 보고서 작성`;
            document.getElementById('date').value = new Date().toISOString().split('T')[0];
            showSection('form');
        }

        document.getElementById('report-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            toggleLoading(true);
            
            const editId = document.getElementById('edit-id').value;
            const dept = document.getElementById('dept').value;
            const writer = document.getElementById('writer').value;
            const date = document.getElementById('date').value;
            const activity = document.getElementById('activity').value;
            const plans = document.getElementById('plans').value;
            const prayer = document.getElementById('prayer').value;

            const data = {
                id: editId || "ID_" + Date.now(),
                dept: dept,
                writer: writer,
                date: date,
                activity: activity,
                plans: plans,
                prayer: prayer
            };
            
            const isGas = typeof google !== 'undefined' && google.script && google.script.run;
            
            try {
                if (isGas) {
                    google.script.run.withSuccessHandler(() => {
                        showToast('저장 성공');
                        resetView();
                    }).saveReport(data);
                } else if (GAS_WEB_APP_URL) {
                    await fetch(`${GAS_WEB_APP_URL}`, {
                        method: 'POST',
                        mode: 'no-cors',
                        body: JSON.stringify({ action: 'save', ...data })
                    });
                    showToast('요청 전송 완료');
                    setTimeout(resetView, 1500);
                } else {
                    let list = JSON.parse(localStorage.getItem('church_reports_v2')) || [];
                    if (editId) {
                        list = list.filter(r => r.id !== editId);
                    }
                    list.unshift(data);
                    localStorage.setItem('church_reports_v2', JSON.stringify(list));
                    showToast('로컬 저장 완료');
                    resetView();
                }
            } catch (err) {
                showToast('저장 오류');
            } finally {
                toggleLoading(false);
            }
        });
    </script>
</body>
</html>
