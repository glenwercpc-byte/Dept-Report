<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCPC 부서별 보고서 관리 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; }
        
        .animate-dropdown { 
            animation: dropdownSlide 0.2s ease-out; 
            transform-origin: top;
        }
        @keyframes dropdownSlide {
            from { opacity: 0; transform: translateY(-10px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        .auto-list { counter-reset: item; list-style-type: none; padding-left: 0; margin: 0; }
        .auto-list li { display: flex; margin-bottom: 4px; line-height: 1.5; font-size: 0.9rem; }
        .auto-list li::before { 
            content: counter(item) ". "; 
            counter-increment: item; 
            font-weight: bold; 
            margin-right: 8px; 
            color: #6366f1;
            flex-shrink: 0;
        }

        .report-table { width: 100%; border-collapse: collapse; table-layout: fixed; border: 1.5px solid #1e293b; background: white; }
        .report-table th, .report-table td { border: 1px solid #94a3b8; padding: 12px 10px; vertical-align: top; word-break: break-all; }
        .report-table th { background-color: #f8fafc; font-size: 0.8rem; color: #1e293b; font-weight: 800; text-align: center; }
        
        .dept-col { width: 15%; vertical-align: middle !important; text-align: center; background-color: #fcfcfd; }
        .content-col { width: 28.33%; }

        @media print {
            .no-print { display: none !important; }
            .print-area { display: block !important; width: 100% !important; margin: 0 !important; padding: 0 !important; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            @page { size: A4 portrait; margin: 1cm; }
        }

        .loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9); z-index: 9999;
            display: none; justify-content: center; align-items: center;
        }

        .form-overlay {
            animation: fadeIn 0.3s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auto-resize-textarea {
            overflow: hidden;
            min-height: 100px; 
            transition: height 0.1s ease, border-color 0.2s;
            line-height: 1.6;
        }

        .dept-btn-active {
            background-color: #4f46e5 !important;
            color: white !important;
            border-color: #4338ca !important;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.4);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <div id="loading" class="loading-overlay">
        <div class="flex flex-col items-center">
            <i class="fas fa-circle-notch fa-spin text-4xl text-indigo-600 mb-4"></i>
            <p class="font-bold text-slate-600">데이터 처리 중...</p>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="sticky top-0 z-[1100] no-print bg-white/80 backdrop-blur-md border-b border-slate-200 px-4 py-3">
        <div class="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <h1 onclick="location.reload()" class="text-xl font-black flex items-center gap-2 cursor-pointer text-slate-900 shrink-0">
                <i class="fas fa-church text-indigo-600"></i> CCPC <span class="text-indigo-600">부서별 보고서</span>
            </h1>
            
            <div class="flex items-center gap-2 bg-slate-100 p-1.5 rounded-2xl border border-slate-200 shadow-sm">
                <button onclick="location.reload()" class="px-4 py-2.5 bg-white text-slate-600 rounded-xl hover:bg-slate-50 transition border border-slate-200 group flex items-center gap-2 shadow-sm">
                    <i class="fas fa-circle-notch text-sm group-hover:rotate-180 transition-transform duration-500"></i>
                    <span class="text-xs font-bold">초기화</span>
                </button>

                <div class="relative">
                    <button onclick="toggleMonthlyModal()" class="bg-indigo-600 text-white px-5 py-2.5 rounded-xl text-xs font-black hover:bg-indigo-700 transition flex items-center gap-2 shadow-sm">
                        월별 통합 보고서 <i class="fas fa-chevron-down opacity-50 text-[10px]"></i>
                    </button>
                    <div id="monthly-modal" class="hidden absolute top-full left-1/2 -translate-x-1/2 mt-3 w-64 bg-white rounded-2xl shadow-2xl border border-slate-200 p-4 animate-dropdown z-[1200]">
                        <h2 class="text-slate-900 font-black text-sm mb-3 text-center">통합 조회 기간 선택</h2>
                        <div class="grid grid-cols-2 gap-2 mb-4">
                            <select id="filter-year" class="bg-slate-50 border-slate-200 rounded-lg p-2 border text-xs outline-none focus:border-indigo-500"></select>
                            <select id="filter-month" class="bg-slate-50 border-slate-200 rounded-lg p-2 border text-xs outline-none focus:border-indigo-500">
                                <option value="01">1월</option><option value="02">2월</option><option value="03">3월</option><option value="04">4월</option>
                                <option value="05">5월</option><option value="06">6월</option><option value="07">7월</option><option value="08">8월</option>
                                <option value="09">9월</option><option value="10">10월</option><option value="11">11월</option><option value="12">12월</option>
                            </select>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="toggleMonthlyModal(false)" class="flex-1 bg-slate-100 text-slate-600 py-2.5 rounded-lg font-bold hover:bg-slate-200 transition text-xs">
                                취소
                            </button>
                            <button onclick="generateMonthlyReport()" class="flex-[2] bg-slate-900 text-white py-2.5 rounded-lg font-bold hover:bg-black transition text-xs">
                                보고서 생성
                            </button>
                        </div>
                    </div>
                </div>

                <button id="btn-open-form" onclick="toggleWriteForm(true)" class="px-4 py-2.5 bg-white text-emerald-600 rounded-xl hover:bg-emerald-50 transition border border-slate-200 flex items-center gap-2 shadow-sm">
                    <i class="fas fa-plus text-sm"></i>
                    <span class="text-xs font-black">새 보고서 작성</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-4 md:p-6 mb-20">
        <!-- 대시보드 박스 -->
        <div id="dashboard" class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8 no-print">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                <p class="text-[10px] text-slate-400 font-bold uppercase mb-1">총 누적 보고서</p>
                <h2 id="total-count" class="text-3xl font-black">0</h2>
            </div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                <p class="text-[10px] text-slate-400 font-bold uppercase mb-1">이번 달 제출 건수</p>
                <h2 id="month-count" class="text-3xl font-black">0</h2>
            </div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                <p class="text-[10px] text-slate-400 font-bold uppercase mb-2">이번 달 제출 부서 (클릭 시 조회)</p>
                <div id="active-depts" class="flex flex-wrap gap-1.5">
                    <!-- 제출된 부서 버튼들이 여기에 생성됨 -->
                </div>
            </div>
        </div>

        <section id="section-search" class="no-print">
            <div id="search-bar-container" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row gap-3 items-center mb-6">
                <div class="relative flex-1 w-full">
                    <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-300 text-sm"></i>
                    <input type="text" id="search" placeholder="부서명이나 작성자를 입력하여 검색..." class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-100 rounded-xl outline-none text-sm focus:ring-2 focus:ring-indigo-500 transition" onkeyup="handleSearch(this.value)">
                </div>
            </div>

            <!-- 날짜 선택 칩 영역 -->
            <div id="date-selection-area" class="hidden flex flex-wrap gap-2 p-4 bg-indigo-50/50 rounded-2xl border border-indigo-100 mb-6"></div>

            <div id="main-content-area">
                <!-- 작성 폼 -->
                <div id="write-form-area" class="hidden form-overlay">
                    <div class="bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden">
                        <form id="report-form" class="p-6 md:p-8 space-y-8" onsubmit="submitForm(event)">
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                                <div class="space-y-2">
                                    <label class="text-[11px] font-black text-slate-500 uppercase ml-1">부서 선택</label>
                                    <select id="form-dept" required class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-bold focus:ring-2 focus:ring-indigo-500 outline-none"></select>
                                </div>
                                <div class="space-y-2">
                                    <label class="text-[11px] font-black text-slate-500 uppercase ml-1">작성자</label>
                                    <input type="text" id="form-writer" required placeholder="이름 입력" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-bold focus:ring-2 focus:ring-indigo-500 outline-none">
                                </div>
                                <div class="space-y-2">
                                    <label class="text-[11px] font-black text-slate-500 uppercase ml-1">작성일</label>
                                    <input type="date" id="form-date" required class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-bold focus:ring-2 focus:ring-indigo-500 outline-none">
                                </div>
                            </div>

                            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                <div class="space-y-2">
                                    <label class="text-[11px] font-black text-indigo-600 uppercase ml-1 flex items-center gap-2"><i class="fas fa-tasks"></i> 활동 내역</label>
                                    <textarea id="form-activity" required placeholder="내용이 없으면 자동으로 건너뜁니다." class="auto-resize-textarea w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition resize-none" onfocus="handleTextareaFocus(this)" oninput="handleTextareaInput(this)" onkeydown="handleTextareaKeydown(event, this)"></textarea>
                                </div>
                                <div class="space-y-2">
                                    <label class="text-[11px] font-black text-emerald-600 uppercase ml-1 flex items-center gap-2"><i class="fas fa-calendar-alt"></i> 사역 계획</label>
                                    <textarea id="form-plans" placeholder="내용이 없으면 자동으로 건너뜁니다." class="auto-resize-textarea w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl text-sm focus:ring-2 focus:ring-emerald-500 outline-none transition resize-none" onfocus="handleTextareaFocus(this)" oninput="handleTextareaInput(this)" onkeydown="handleTextareaKeydown(event, this)"></textarea>
                                </div>
                                <div class="space-y-2">
                                    <label class="text-[11px] font-black text-amber-600 uppercase ml-1 flex items-center gap-2"><i class="fas fa-comment-dots"></i> 건의사항 및 기타</label>
                                    <textarea id="form-prayer" placeholder="내용이 없으면 자동으로 건너뜁니다." class="auto-resize-textarea w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl text-sm focus:ring-2 focus:ring-amber-500 outline-none transition resize-none" onfocus="handleTextareaFocus(this)" oninput="handleTextareaInput(this)" onkeydown="handleTextareaKeydown(event, this)"></textarea>
                                </div>
                            </div>
                            
                            <div class="flex justify-center gap-3 pt-4">
                                <button type="button" onclick="toggleWriteForm(false)" class="w-32 bg-slate-200 text-slate-600 py-3 rounded-xl font-bold text-sm hover:bg-slate-300 transition">
                                    취소
                                </button>
                                <button type="submit" class="w-48 bg-indigo-600 text-white py-3 rounded-xl font-black text-sm hover:bg-indigo-700 transition shadow-lg shadow-indigo-600/20">
                                    보고서 제출하기
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- 결과 조회 영역 (박스 안에서 보여줌) -->
                <div id="search-result-area">
                    <div class="text-center py-24 bg-white/50 rounded-3xl border border-dashed border-slate-300">
                        <i class="fas fa-search text-slate-300 text-5xl mb-6"></i>
                        <p class="text-slate-500 font-bold text-lg">검색어를 입력하거나 상단 부서 버튼을 클릭해 보고서를 조회하세요.</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- 월별 통합 보고서 영역 (인쇄용) -->
        <section id="section-monthly" class="hidden">
            <div class="no-print flex justify-between items-center mb-8 bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                 <button onclick="location.reload()" class="text-slate-600 px-5 py-2.5 rounded-xl font-bold text-sm border border-slate-200 hover:bg-slate-50"><i class="fas fa-arrow-left mr-2"></i> 돌아가기</button>
                 <button onclick="window.print()" class="bg-slate-900 text-white px-6 py-2.5 rounded-xl font-bold text-sm shadow-xl flex items-center gap-2"><i class="fas fa-print"></i> PDF/프린트 출력</button>
            </div>
            <div id="monthly-report-content" class="print-area"></div>
        </section>
    </main>

    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-8 py-4 rounded-2xl opacity-0 translate-y-4 transition-all z-[9999] text-sm font-bold shadow-2xl pointer-events-none"></div>

    <script>
        const SPREADSHEET_ID = '1eUQvpba39oksft4zFdu8R-yro6H1S9lqUA58CkfyAIs';
        const SHEET_CSV_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv`;
        const DEPARTMENTS = ["목회실", "총무부", "교우부", "새가족부", "장학부", "예배부", "방송부", "찬양부", "장년교육부", "유치유년부", "중고등부", "청년부", "선교부", "관리부", "봉사부", "재정부", "EM"];
        
        let allReports = [];
        let currentYear = new Date().getFullYear();
        let currentMonth = String(new Date().getMonth() + 1).padStart(2, '0');

        window.onload = () => {
            initOptions();
            loadReports();
        };

        // 자동 리스트 및 높이 조절
        function handleTextareaFocus(el) {
            if (el.value.trim() === "") {
                el.value = "1. ";
                handleTextareaInput(el);
            }
        }

        function handleTextareaInput(el) {
            el.style.height = 'auto';
            el.style.height = (el.scrollHeight) + 'px';
        }

        function handleTextareaKeydown(e, el) {
            if (e.key === 'Enter') {
                e.preventDefault();
                const cursorPos = el.selectionStart;
                const textBefore = el.value.substring(0, cursorPos);
                const textAfter = el.value.substring(cursorPos);
                
                const lines = textBefore.split('\n');
                const lastLine = lines[lines.length - 1];
                const match = lastLine.match(/^(\d+)\.\s*/);
                
                let nextNum = 1;
                if (match) {
                    nextNum = parseInt(match[1]) + 1;
                } else {
                    nextNum = lines.length + 1;
                }

                const insertText = `\n${nextNum}. `;
                el.value = textBefore + insertText + textAfter;
                const newPos = cursorPos + insertText.length;
                el.setSelectionRange(newPos, newPos);
                handleTextareaInput(el);
            }
            
            // 내용이 "1. "만 남은 상태에서 백스페이스를 누르면 아예 비움
            if (e.key === 'Backspace' && el.value.trim() === "1.") {
                el.value = "";
            }
        }

        function initOptions() {
            const yearSelect = document.getElementById('filter-year');
            for(let i = 2024; i <= 2026; i++) {
                const opt = document.createElement('option');
                opt.value = i; opt.innerText = i + '년';
                yearSelect.appendChild(opt);
            }
            yearSelect.value = currentYear;
            document.getElementById('filter-month').value = currentMonth;

            const deptFormSelect = document.getElementById('form-dept');
            deptFormSelect.innerHTML = '<option value="" disabled selected>부서 선택</option>';
            DEPARTMENTS.forEach(d => {
                const opt = document.createElement('option');
                opt.value = d; opt.innerText = d;
                deptFormSelect.appendChild(opt);
            });
            
            const today = new Date();
            const formattedDate = today.toISOString().split('T')[0];
            document.getElementById('form-date').value = formattedDate;
        }

        async function loadReports() {
            toggleLoading(true);
            try {
                const res = await fetch(`${SHEET_CSV_URL}&t=${Date.now()}`);
                const csv = await res.text();
                allReports = parseCSV(csv);
                updateDashboard();
            } catch (e) {
                showToast("데이터 로드 실패");
            } finally {
                toggleLoading(false);
            }
        }

        function parseCSV(csv) {
            const lines = csv.split('\n');
            const result = [];
            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const currentline = lines[i].match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || lines[i].split(',');
                result.push({
                    id: (currentline[0] || '').replace(/"/g, '').trim(),
                    date: (currentline[1] || '').replace(/"/g, '').trim(),
                    dept: (currentline[2] || '').replace(/"/g, '').trim(),
                    writer: (currentline[3] || '').replace(/"/g, '').trim(),
                    activity: (currentline[4] || '').replace(/"/g, '').trim(),
                    plans: (currentline[5] || '').replace(/"/g, '').trim(),
                    prayer: (currentline[6] || '').replace(/"/g, '').trim()
                });
            }
            return result;
        }

        function updateDashboard() {
            document.getElementById('total-count').innerText = allReports.length;
            const prefix = `${currentYear}-${currentMonth}`;
            const monthReps = allReports.filter(r => String(r.date).startsWith(prefix));
            document.getElementById('month-count').innerText = monthReps.length;
            
            const depts = [...new Set(monthReps.map(r => r.dept))].sort((a, b) => DEPARTMENTS.indexOf(a) - DEPARTMENTS.indexOf(b));
            const container = document.getElementById('active-depts');
            
            container.innerHTML = depts.map(d => 
                `<button id="btn-dept-${d}" onclick="searchByDept('${d}')" class="dept-action-btn bg-white text-indigo-600 text-[11px] font-black px-3 py-1.5 rounded-xl border border-indigo-200 hover:bg-indigo-50 hover:border-indigo-400 transition shadow-sm">
                    ${d}
                </button>`
            ).join('') || '<span class="text-xs text-slate-300 italic">제출 없음</span>';
        }

        function toggleWriteForm(show) {
            const formArea = document.getElementById('write-form-area');
            const resultArea = document.getElementById('search-result-area');
            const dateArea = document.getElementById('date-selection-area');
            const searchBar = document.getElementById('search-bar-container');

            if (show) {
                formArea.classList.remove('hidden');
                resultArea.classList.add('hidden');
                dateArea.classList.add('hidden');
                searchBar.classList.add('hidden');
                document.getElementById('report-form').reset();
                
                const today = new Date();
                const formattedDate = today.toISOString().split('T')[0];
                document.getElementById('form-date').value = formattedDate;
                
                document.querySelectorAll('.auto-resize-textarea').forEach(ta => ta.style.height = '100px');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                formArea.classList.add('hidden');
                resultArea.classList.remove('hidden');
                searchBar.classList.remove('hidden');
                handleSearch('');
            }
        }

        function searchByDept(name) {
            document.getElementById('search').value = name;
            document.querySelectorAll('.dept-action-btn').forEach(btn => btn.classList.remove('dept-btn-active'));
            const targetBtn = document.getElementById(`btn-dept-${name}`);
            if(targetBtn) targetBtn.classList.add('dept-btn-active');
            handleSearch(name);
            document.getElementById('search-bar-container').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function handleSearch(term) {
            const trimmed = term.toLowerCase().trim();
            const dateArea = document.getElementById('date-selection-area');
            const resultArea = document.getElementById('search-result-area');
            const writeArea = document.getElementById('write-form-area');

            writeArea.classList.add('hidden');

            if (!trimmed) {
                dateArea.classList.add('hidden');
                resultArea.innerHTML = `<div class="text-center py-24 bg-white/50 rounded-3xl border border-dashed border-slate-300"><p class="text-slate-500 font-bold text-lg">검색어를 입력하거나 상단 부서 버튼을 클릭해 보고서를 조회하세요.</p></div>`;
                document.querySelectorAll('.dept-action-btn').forEach(btn => btn.classList.remove('dept-btn-active'));
                return;
            }

            const filtered = allReports.filter(r => 
                (r.dept && r.dept.toLowerCase().includes(trimmed)) || 
                (r.writer && r.writer.toLowerCase().includes(trimmed))
            );

            if (filtered.length === 0) {
                dateArea.classList.add('hidden');
                resultArea.innerHTML = `<div class="text-center py-20 bg-white rounded-3xl border border-dashed border-slate-200"><p class="text-slate-400 font-medium">검색 결과가 없습니다.</p></div>`;
                return;
            }

            dateArea.classList.remove('hidden');
            dateArea.innerHTML = filtered.sort((a,b) => new Date(b.date) - new Date(a.date)).map(r => `
                <button onclick="renderDetailById('${r.id}')" class="px-4 py-2 bg-white border border-slate-200 rounded-xl text-xs font-bold shadow-sm hover:border-indigo-400 hover:text-indigo-600 transition">
                    ${r.date.split(' ')[0]} - ${r.dept}
                </button>
            `).join('');

            renderDetail(filtered.sort((a,b) => new Date(b.date) - new Date(a.date))[0]);
        }

        function renderDetailById(id) {
            const r = allReports.find(rep => rep.id === id);
            if (r) renderDetail(r);
        }

        function renderDetail(r) {
            const resultArea = document.getElementById('search-result-area');
            
            // 데이터가 비어있거나 넘버링(1. )만 있는 경우 필터링
            const activityHtml = formatToList(r.activity);
            const plansHtml = formatToList(r.plans);
            const prayerHtml = formatToList(r.prayer);

            resultArea.innerHTML = `
                <div class="bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden animate-dropdown">
                    <div class="bg-indigo-600 p-6 flex justify-between items-center text-white">
                        <div><h2 class="text-lg font-black">${r.dept} 사역 보고</h2><p class="text-[11px] opacity-80 mt-1">${r.date} 제출</p></div>
                        <div class="text-right"><span class="text-xs bg-white/20 px-3 py-1.5 rounded-full font-bold">작성자: ${r.writer}</span></div>
                    </div>
                    <div class="p-8 grid grid-cols-1 md:grid-cols-3 gap-8">
                        ${activityHtml ? `<div><h4 class="text-xs font-black text-indigo-600 uppercase mb-4">활동 내역</h4><ul class="auto-list">${activityHtml}</ul></div>` : ''}
                        ${plansHtml ? `<div><h4 class="text-xs font-black text-emerald-600 uppercase mb-4">사역 계획</h4><ul class="auto-list">${plansHtml}</ul></div>` : ''}
                        ${prayerHtml ? `<div><h4 class="text-xs font-black text-amber-600 uppercase mb-4">건의 및 기타</h4><ul class="auto-list">${prayerHtml}</ul></div>` : ''}
                        ${!activityHtml && !plansHtml && !prayerHtml ? '<div class="col-span-3 text-center text-slate-400 py-10">상세 내용이 없습니다.</div>' : ''}
                    </div>
                </div>
            `;
        }

        async function submitForm(e) {
            e.preventDefault();
            toggleLoading(true);
            
            // 데이터 클렌징: 넘버링만 있는 경우 빈 값으로 처리
            const cleanText = (val) => {
                const trimmed = val.trim();
                return (trimmed === "1." || trimmed === "1. ") ? "" : trimmed;
            };

            const formData = {
                dept: document.getElementById('form-dept').value,
                writer: document.getElementById('form-writer').value,
                date: document.getElementById('form-date').value,
                activity: cleanText(document.getElementById('form-activity').value),
                plans: cleanText(document.getElementById('form-plans').value),
                prayer: cleanText(document.getElementById('form-prayer').value)
            };

            // 실제 백엔드 연동 시 아래 주석 해제 및 앱스스크립트 연동
            /*
            await fetch('YOUR_GAS_URL', { method: 'POST', body: JSON.stringify(formData) });
            */

            setTimeout(() => {
                toggleLoading(false);
                showToast("성공적으로 제출되었습니다!");
                toggleWriteForm(false);
                loadReports();
            }, 800);
        }

        function generateMonthlyReport() {
            const year = document.getElementById('filter-year').value;
            const month = document.getElementById('filter-month').value;
            const prefix = `${year}-${month}`;
            const filtered = allReports.filter(r => String(r.date).startsWith(prefix)).sort((a,b) => DEPARTMENTS.indexOf(a.dept) - DEPARTMENTS.indexOf(b.dept));
            
            if (!filtered.length) { 
                showToast(`${parseInt(month)}월 기록이 없습니다.`); 
                return; 
            }

            document.getElementById('section-search').classList.add('hidden');
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('section-monthly').classList.remove('hidden');
            toggleMonthlyModal(false);
            
            const container = document.getElementById('monthly-report-content');
            let html = `<div class="text-center mb-10"><h1 class="text-3xl font-black">${year}년 ${parseInt(month)}월 사역 통합 보고서</h1></div><table class="report-table"><thead><tr><th class="dept-col">부서/작성자</th><th class="content-col">활동 내역</th><th class="content-col">사역 계획</th><th class="content-col">건의사항 및 기타</th></tr></thead><tbody>`;
            
            filtered.forEach(r => {
                const act = formatToList(r.activity);
                const pln = formatToList(r.plans);
                const pry = formatToList(r.prayer);

                html += `<tr>
                    <td class="dept-col"><div class="font-black">${r.dept}</div><div class="text-[10px] text-slate-400 mt-1">${r.writer}</div></td>
                    <td><ul class="auto-list">${act || '<li style="list-style:none; color:#cbd5e1;">-</li>'}</ul></td>
                    <td><ul class="auto-list">${pln || '<li style="list-style:none; color:#cbd5e1;">-</li>'}</ul></td>
                    <td><ul class="auto-list">${pry || '<li style="list-style:none; color:#cbd5e1;">-</li>'}</ul></td>
                </tr>`;
            });
            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        // 텍스트를 리스트 HTML로 변환하는 핵심 함수
        function formatToList(text) {
            if (!text || text.trim() === "" || text === "undefined" || text.trim() === "1.") return null;
            
            // "1. "만 있는 행 제외 및 번호 마커 제거 후 li 태그로 변환
            const lines = text.split('\n')
                .map(l => l.trim())
                .filter(l => l !== "" && l !== "1.");

            if (lines.length === 0) return null;

            return lines.map(l => `<li>${l.replace(/^\d+[\.\)]\s*/, '')}</li>`).join('');
        }

        function toggleMonthlyModal(force) {
            const modal = document.getElementById('monthly-modal');
            const shouldShow = (typeof force === 'boolean') ? force : modal.classList.contains('hidden');
            modal.classList.toggle('hidden', !shouldShow);
        }

        function toggleLoading(show) { document.getElementById('loading').style.display = show ? 'flex' : 'none'; }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.replace('opacity-0', 'opacity-100');
            t.classList.replace('translate-y-4', 'translate-y-0');
            setTimeout(() => { 
                t.classList.replace('opacity-100', 'opacity-0'); 
                t.classList.replace('translate-y-0', 'translate-y-4');
            }, 3000);
        }
    </script>
</body>
</html>
